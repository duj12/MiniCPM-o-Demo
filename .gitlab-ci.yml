# MiniCPM-o-Demo 镜像构建 CI
#
# 参考 Fun-ASR-deploy/.gitlab-ci.yml：构建镜像时从 SVN 下载模型到 checkpoints/，
# 随 `COPY . .` 打进镜像。模型仓库：svn://svn-local.xmov.ai/repository/AlgModels/OmniLLM
#   - latest 分支（默认）：qwen3omni-gguf/ fsmn-vad-onnx/ TurnSense/
# 分支映射（同 Fun-ASR-deploy）：master/pre/qa 各对应 SVN 子目录，私分支不变。

variables:
  SVN_REPO_URL: 'svn://svn-local.xmov.ai/repository/AlgModels/OmniLLM/latest'
  SVN_LOCAL_PATH: '/data/nas/xmov_app/omni-llm/svn/latest'
  IMAGE_NAMES: 'minicpm-cpp-worker-backend'

include:
  - project: 'devops1/gitlab-ci'
    file: 'common-variables.yml'
  - project: 'devops1/gitlab-ci'
    file: 'before-script.yml'
  - project: 'devops1/gitlab-ci'
    file: 'send-feishu-msg.yml'
  - project: 'devops1/gitlab-ci'
    file: 'update-helm.yml'
  - project: 'devops1/gitlab-ci'
    file: 'upload-chart.yml'

stages:
  - build
  - deploy

build_image:
  stage: build
  only:
    - qa
    - pre
    - master
  resource_group: $CI_PROJECT_NAME
  script:
    - |
      if [[ "$CI_COMMIT_REF_NAME" == "master" || "$CI_COMMIT_REF_NAME" == "pre" ]]; then
        echo "Working at $CI_COMMIT_REF_NAME branch, changing svn path..."
        SVN_REPO_URL=svn://svn-local.xmov.ai/repository/AlgModels/OmniLLM/$CI_COMMIT_REF_NAME
        SVN_LOCAL_PATH=/data/nas/xmov_app/omni-llm/svn/$CI_COMMIT_REF_NAME
      else
        echo "No need to change svn path."
      fi
      echo "SVN_REPO_URL=$SVN_REPO_URL"
      if [ -d "$SVN_LOCAL_PATH/.svn" ]; then
        echo "SVN working copy exists. Updating..."
        svn update "$SVN_LOCAL_PATH" --username "$SVN_USERNAME" --password "$SVN_PASSWORD"
      else
        echo "No SVN working copy found. Checking out..."
        svn checkout "$SVN_REPO_URL" "$SVN_LOCAL_PATH" --username "$SVN_USERNAME" --password "$SVN_PASSWORD"
      fi
    - echo "Exporting checkpoints from SVN..."
    - rm -rf ./checkpoints
    - svn export "$SVN_LOCAL_PATH" ./checkpoints
    - ls -la ./checkpoints/
    - echo "Building image with tag $CI_COMMIT_SHORT_SHA"
    - |
      docker compose -f docker-compose.cpp.yml build cpp-worker-backend
    - |
      for IMAGE_NAME in "${IMAGE_NAME_ARRAY[@]}"; do
        docker tag minicpm-cpp-worker-backend:dev $DEV_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        docker push $DEV_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        if [[ $CI_COMMIT_REF_NAME == $CI_COMMIT_BRANCH ]]; then
          if [[ "$CI_COMMIT_REF_NAME" == "master" || "$CI_COMMIT_REF_NAME" == "pre" ]]; then
            REGISTRY=$PRO_REGISTRY
          else
            REGISTRY=$DEV_REGISTRY
          fi
          if [[ $CI_COMMIT_REF_NAME == "master" ]]; then
            docker tag $DEV_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA $REGISTRY/$IMAGE_NAME:latest
            docker push $REGISTRY/$IMAGE_NAME:latest
          fi
          docker tag $DEV_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA $REGISTRY/$IMAGE_NAME:$CI_COMMIT_REF_NAME
          docker push $REGISTRY/$IMAGE_NAME:$CI_COMMIT_REF_NAME
          docker tag $DEV_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
        else
          docker tag $DEV_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA $PRO_REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG
          docker push $PRO_REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG
        fi
      done
  extends: .send-feishu-build-msg
  tags:
    - node-140
