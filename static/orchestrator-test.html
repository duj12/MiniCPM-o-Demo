<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orchestrator 前端验证</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px/1.6 -apple-system, "Segoe UI", sans-serif; margin: 0;
         background: #111; color: #e6e6e6; }
  .wrap { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  .col { flex: 1 1 380px; min-width: 320px; }
  video { width: 100%; border-radius: 8px; background: #000; }
  /* 视频 + 人脸叠加层 */
  .stage { position: relative; line-height: 0; }
  .stage canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%;
                          border-radius: 8px; pointer-events: none; }
  button { padding: 10px 18px; font-size: 15px; border-radius: 8px;
           border: 1px solid #444; background: #2a2a2a; color: #e6e6e6;
           cursor: pointer; margin-right: 8px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.danger  { background: #b91c1c; border-color: #b91c1c; }
  .log { height: 340px; overflow-y: auto; background: #1a1a1a;
         border: 1px solid #333; border-radius: 8px; padding: 10px;
         font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .log div { margin-bottom: 3px; word-break: break-all; }
  .k { color: #7dd3fc; }  .v { color: #86efac; }  .e { color: #fca5a5; }
  .m { color: #fcd34d; }
  .stats { font-family: ui-monospace, monospace; font-size: 12px;
           background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
           padding: 10px; margin-top: 10px; }
  /* 字幕区：长回复要能完整显示并可滚动（早先限高+截断，长回复看不全） */
  .sub { margin-top: 10px; min-height: 60px; max-height: 300px;
         overflow-y: auto; background: #1a1a1a;
         border: 1px solid #333; border-radius: 8px; padding: 10px;
         line-height: 1.6; word-break: break-word; }
  h3 { margin: 0 0 8px; font-size: 14px; color: #aaa; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <h3>摄像头（人脸框叠加）</h3>
    <div class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <canvas id="cv" style="display:none"></canvas>
    <div class="stats" id="faceinfo">人脸：等待中…</div>
    <div style="margin-top:12px">
      <label style="display:block;margin-bottom:8px">
        回声消除：
        <!-- 默认 service（与后端 ORCH_AEC_MODE 默认一致）。
             选了会记住（localStorage），刷新后保持上次的选择。 -->
        <select id="aecMode">
          <option value="service">算法服务 AEC（需先校准延迟）</option>
          <option value="browser">浏览器原生 AEC（不受网络延迟影响）</option>
          <option value="off">不做回声消除</option>
        </select>
      </label>
      <button id="btnStart" class="primary">开始会话</button>
      <button id="btnUnlock">🔊 解锁音频</button>
      <button id="btnCalib">⏱ 校准延迟</button>
      <button id="btnStop" class="danger">停止</button>
      <button id="btnExport">⤓ 导出诊断</button>
      <button id="btnCalibWav">🎧 导出校准录音</button>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#888">
      「校准延迟」不需要先开始会话：点一下 → 授权麦克风 → 播放 1.7 秒校准音
      → 自动算出声学延迟并保存。<b>请外放，不要戴耳机</b>（耳机没有回声路径）。
      <br>校准失败时点「导出校准录音」，把两个 WAV 发出来即可确诊是「没播出来」
      还是「没进麦克风」。
    </div>
    <div class="stats" id="delayinfo">延迟：未测量</div>
    <div class="stats" id="audiostat">音频：未开始</div>
    <div class="stats" id="stats">未开始</div>
  </div>
  <div class="col">
    <h3>字幕 / 事件</h3>
    <!-- ASR 与 TTS 分两个区域：ASR 是**替换**语义（流式刷新同一行），
         TTS 是**追加**语义（多轮累积）。早先共用一个元素，ASR 的替换
         会把播报记录冲掉。 -->
    <div class="sub" id="subtitle">
      <div id="asrline">（等待 ASR 输出）</div>
    </div>
    <h3 style="margin-top:10px">播报记录</h3>
    <div class="sub" id="ttslog">（等待播报）</div>
    <h3 style="margin-top:14px">事件日志</h3>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="/static/duplex/lib/orchestrator-session.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log'), statsEl = $('stats');
let session = null, micStream = null, audioCtx = null, workletNode = null;
let videoStream = null, running = false, frameCounter = 0;

function log(cls, msg) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild);
}

/* ---------- 播放器：PCM16 24kHz → WebAudio，并暴露 ctx 时间供回执 ---------- */
/* 播放诊断：把每一步的可疑点暴露到页面上。
 * 远程调试时看不到控制台，必须让状态可见。 */
const diag = {
  ctxState: '-', ctxRate: '-', frames: 0, bytes: 0,
  scheduled: 0, startedAt: '-', lastErr: '-', peak: 0,
};
function diagUpdate() {
  const el = $('audiostat');
  if (!el) return;
  el.innerHTML =
    `AudioContext: <b>${diag.ctxState}</b> @${diag.ctxRate}Hz　` +
    `TTS 帧 <b>${diag.frames}</b> / ${(diag.bytes/2/24000).toFixed(2)}s　` +
    `已调度 <b>${diag.scheduled}</b>　峰值 ${diag.peak.toFixed(3)}<br>` +
    (diag.startedAt !== '-' ? `起播时刻 ${diag.startedAt}<br>` : '') +
    (diag.lastErr !== '-' ? `<span style="color:#fca5a5">错误: ${diag.lastErr}</span>` : '');
}

class PcmPlayer {
  constructor(ctx) {
    this.ctx = ctx;
    this.nextAt = 0;
    this.responseId = null;
    this.srcRate = 24000;       // 服务端 TTS 输出采样率
    this._sources = [];         // 已排程的源，stop() 要逐个掐断
    this._cancelled = false;    // 上一句是否被 cancel（决定下一句是否重排）
    this.gain = ctx.createGain();
    this.gain.gain.value = 1.0;
    this.gain.connect(ctx.destination);
    // 保活节点：某些移动浏览器在没有持续音源时会挂起 context
    this._keep = ctx.createConstantSource
      ? ctx.createConstantSource() : null;
    if (this._keep) {
      this._keep.offset.value = 0;
      this._keep.connect(ctx.destination);
      this._keep.start();
    }
  }
  now() { return this.ctx.currentTime; }
  beginResponse(id, sr) {
    this.responseId = id;
    this.srcRate = sr || 24000;
    // ⚠️ 若是被 cancel 打断后的新一句（`_cancelled` 已置），排程指针要
    //    **从当前时刻重新开始**，不能沿用它停在旧句末尾的位置 —— 否则
    //    新句被排到旧句之后，而服务端的参考轨是按"当前时刻 + 提前量"
    //    落位的，两边对不上，回声消不掉（实测踩过）。
    if (this._cancelled) {
      this.nextAt = 0;
      this._cancelled = false;
    }
    // 起播留 200ms 提前量（与云端 config 的 playback_delay_ms 一致）
    this.nextAt = Math.max(this.nextAt, this.ctx.currentTime + 0.2);
  }
  /** 播放一段 int16 base64 PCM。
   *  **手动重采样到 AudioContext 的实际采样率** —— 不用 createBuffer 的
   *  异采样率路径。部分移动浏览器（尤其 Safari 旧版）在 buffer 采样率与
   *  context 不一致时行为不可靠，会静默无声。 */
  playBase64(b64, sr) {
    const bin = atob(b64);
    const n = bin.length >> 1;
    const i16 = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      i16[i] = (bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8)) << 16 >> 16;
    }
    const srcRate = sr || this.srcRate;
    // int16 → float32 + 峰值统计（诊断用：能区分"没送到"与"送到了但没响"）
    let peak = 0;
    const f32src = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const v = i16[i] / 32768;
      f32src[i] = v;
      const a = Math.abs(v);
      if (a > peak) peak = a;
    }
    diag.peak = Math.max(diag.peak, peak);
    return this.playFloat32(f32src, srcRate);
  }
  /** 播放一段 float32 PCM（[-1,1]）。返回**实际起播时刻**（ctx 秒）。
   *
   *  校准通道走这里 —— 与 TTS 共用同一条播放路径（同一份重采样、同一个
   *  提前量、同一个 AudioContext），否则测出的延迟无法迁移到实际会话。 */
  playFloat32(f32src, srcRate) {
    const n = f32src.length;
    const ctxRate = this.ctx.sampleRate;

    // 线性重采样到 context 采样率
    let f32 = f32src, rate = srcRate;
    if (ctxRate && Math.abs(ctxRate - srcRate) > 1) {
      const outN = Math.max(1, Math.round(n * ctxRate / srcRate));
      f32 = new Float32Array(outN);
      const ratio = n / outN;
      for (let i = 0; i < outN; i++) {
        const p = i * ratio;
        const i0 = Math.floor(p), i1 = Math.min(i0 + 1, n - 1);
        const fr = p - i0;
        f32[i] = f32src[i0] * (1 - fr) + f32src[i1] * fr;
      }
      rate = ctxRate;
    }

    const buf = this.ctx.createBuffer(1, f32.length, rate);
    buf.copyToChannel(f32, 0);
    const node = this.ctx.createBufferSource();
    node.buffer = buf;
    node.connect(this.gain);
    const at = Math.max(this.nextAt, this.ctx.currentTime + 0.02);
    node.start(at);
    // 登记已排程的源 —— stop() 要能逐个掐断（WebAudio 不能"取消 start"，
    // 只能对源调 stop()）。播完的自己摘掉，避免数组无限增长。
    if (!this._sources) this._sources = [];
    this._sources.push(node);
    node.onended = () => {
      const i = this._sources.indexOf(node);
      if (i >= 0) this._sources.splice(i, 1);
    };
    this.nextAt = at + buf.duration;
    this.lastStartAt = at;      // 起播时刻（ctx 秒）—— 校准要上报锚点
    diag.scheduled += 1;
    if (diag.startedAt === '-') {
      diag.startedAt = `+${(at - this.ctx.currentTime).toFixed(2)}s`;
    }
    diagUpdate();
    return at;
  }
  endResponse() { /* 队列自然播完 */ }
  /** 立刻停止播放并清空已排程的内容。
   *
   *  ⚠️ 早先这个函数是**空操作**：把 gain 设 0 又立刻设回 1（等于没做），
   *  而且 `node.start(at)` 一旦调用，已排程的 buffer **必然会播** ——
   *  WebAudio 没有"取消已 start 的源"的接口。结果就是"打断了但旧句还在
   *  响"，新回复的参考轨与实际播出对不上，回声全部漏给 ASR。
   *
   *  正确的做法：
   *    ① 记录每一个已排程的源，逐个 `stop(0)` 掐断（对已排程未播的源
   *       也是有效的 —— stop 会取消它）
   *    ② 把 gain 短暂置 0 兜住 stop(0) 可能残留的几十微秒
   *    ③ 复位排程指针，让下一句从"现在"开始
   */
  stop() {
    for (const n of (this._sources || [])) {
      try { n.stop(0); } catch (e) { /* 已播完的源 stop 会抛，忽略 */ }
      try { n.disconnect(); } catch (e) { /* ignore */ }
    }
    this._sources = [];
    try {
      const g = this.gain.gain;
      g.cancelScheduledValues(this.ctx.currentTime);
      g.setValueAtTime(0, this.ctx.currentTime);
      g.setValueAtTime(1, this.ctx.currentTime + 0.03);
    } catch (e) { /* ignore */ }
    this.nextAt = this.ctx.currentTime + 0.05;
    this._cancelled = true;    // 告诉 beginResponse：下一句从零重排
    diagUpdate();
  }
}

/* ---------- AEC 模式 / 延迟显示 ---------- */
const AEC_MODE_KEY = 'orch_aec_mode';

function selectedAecMode() {
  const el = $('aecMode');
  return el ? el.value : 'service';
}

/** 恢复上次选择（刷新后保持），并绑定变更持久化。 */
function initAecMode() {
  const el = $('aecMode');
  if (!el) return;
  try {
    const saved = localStorage.getItem(AEC_MODE_KEY);
    if (saved) el.value = saved;
  } catch (e) { /* ignore */ }
  // onchange 在别处已绑（切换逻辑），这里只加持久化
  el.addEventListener('change', () => {
    try { localStorage.setItem(AEC_MODE_KEY, el.value); } catch (e) {}
  });
}

/** 设备标识：用于让服务端记住这台设备的延迟（下次冷启动即准）。 */
function deviceKey() {
  let k = localStorage.getItem('orch_device_key');
  if (!k) {
    k = 'dev_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('orch_device_key', k);
  }
  return k;
}

/** 显示服务端推来的链路状态（重点是声学延迟）。 */
let lastStats = null;
let lastCalibResult = null;
// 最近一次校准的原始录音（供「导出校准录音」做离线确诊）
let calCapture = null;
// 实测容忍窗：D 偏 5ms 就开始掉，偏 166ms 完全失效
// （见 tests/test_aec_live_fidelity.py 的扫描表）
const DELAY_TOLERANCE_MS = 5;

function renderDelay(s) {
  lastStats = s;
  const el = $('delayinfo');
  if (!el) return;
  const modeName = { browser: '浏览器原生', service: '算法服务', off: '关闭' };
  const srcName = { stored: '历史记录', default: '默认值',
                    measured: '自适应测量', calibrated: '校准值',
                    client: '前端上报' };
  let html =
    `回声消除：<b>${modeName[s.aec_mode] || s.aec_mode}</b>　` +
    `声学延迟：<b>${s.delay_ms.toFixed(1)} ms</b> ` +
    `（${srcName[s.delay_source] || s.delay_source}）`;
  if (s.aec_mode === 'service') {
    // D 的三态 —— "未测量"必须**显著**，不能显示成一个看似正常的数字。
    // 实测：D 错 166ms（旧默认值 250 vs 真值 84）时回声抑制只有 0.3dB，
    // 等于完全不工作；而 UI 上两者长得一模一样。
    if (s.delay_source === 'default') {
      html += `<br><span style="color:#fca5a5"><b>⚠️ D 尚未测量</b> —— `
            + `现在用的是默认值 ${s.delay_ms.toFixed(0)}ms，`
            + `算法 AEC 大概率**不生效**（容忍窗仅 ±${DELAY_TOLERANCE_MS}ms）。`
            + `请点「校准延迟」或先播报一轮让自适应收敛。</span>`;
    } else if (s.delay_source === 'measured') {
      const n = s.delay_estimates || 0;
      if (n < 3) {
        html += `<br><span style="color:#fcd34d">D 收敛中（第 ${n} 次估计）`
              + ` —— 再播报一两轮会更准</span>`;
      } else {
        html += `<br><span style="color:#86efac">D 已收敛`
              + `（${n} 次估计）</span>`;
      }
    } else if (s.delay_source === 'calibrated') {
      html += `<br><span style="color:#86efac">D 已校准</span>`;
    }
    // 建议值 = 服务端认为应当采用的 D（已测量时为实测值，否则为默认值）。
    // 与当前值并列显示：两者不一致就说明还没收敛/被历史记录拖住。
    html += `<br>建议设置：<b>${s.suggested_delay_ms.toFixed(1)} ms</b>`;
    if (s.delay_measured && Math.abs(s.suggested_delay_ms - s.delay_ms) > 1) {
      html += ` <span style="color:#fcd34d">（与当前值不一致，`
            + `下一次播报会收敛）</span>`;
    }
    if (s.delay_measured && s.delay_ms > 400) {
      html += `<br><span style="color:#fca5a5">D 偏大（${s.delay_ms.toFixed(0)}ms）`
            + ` —— 请确认外放且未戴耳机；该值可能是选错峰</span>`;
    }
  }
  if (s.aec_active) {
    html += `<br>云端 AEC：工作中，farend 非零占比 `
          + `${(s.ref_nonzero_ratio*100).toFixed(0)}%`;
    if (s.erle_db != null) {
      // 每轮播报独立测量（近端也计入，故绝对值偏低；看**变化**）
      // 参照实测：D 对齐时 10~12dB，错位时 0.3dB。
      const good = s.erle_db >= 6;
      html += `　本轮 ERLE：<b style="color:${good ? '#86efac' : '#fca5a5'}">` +
              `${s.erle_db.toFixed(1)} dB</b>`;
      if (!good) {
        html += `　<span style="color:#fca5a5">← 抑制≈0，AEC 基本没生效：`
              + `多半是 D 不对（容忍窗 ±${DELAY_TOLERANCE_MS}ms）</span>`;
      }
    }
    if (s.delay_estimate_fails) {
      html += `<br><span style="color:#fcd34d">延迟估计失败 `
            + `${s.delay_estimate_fails} 次</span>`;
    }
  }
  el.innerHTML = html;
}

/* ---------- 采集 ---------- */
async function startCapture() {
  // 回声消除模式由用户在页面上选（见 #aecMode）——**二选一，不能同时开**：
  //   browser —— 浏览器原生 AEC（设备侧工作，不受网络延迟影响）
  //   service —— 云端算法 AEC（需要参考轨按声学延迟 D 预对齐）
  //   off     —— 都不做（调试）
  //
  // ⚠️ 选 service 时**必须关掉浏览器 AEC**：否则回声在设备侧就被消掉了，
  //    送到云端时已经没有回声，算法 AEC 无从下手 —— 这时"测试云端效果"
  //    实际上是浏览器在做功，结论完全失真。
  // ⚠️ **AGC 也必须关**（早先注释说"AGC 不破坏线性性"是错的）：
  //    AGC 是**时变增益**，它会让扬声器→麦克风这条回声路径的增益随信号
  //    起伏 —— 而算法 AEC 的线性自适应滤波器假定该路径是**线性时不变**
  //    的。AGC 一动，滤波器就追不上，抑制上限被显著拉低。
  //    browser 模式保持原样（原生 AEC 自己能处理 AGC）。
  const mode = selectedAecMode();
  const useBrowserAEC = (mode === 'browser');
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: useBrowserAEC,
             noiseSuppression: useBrowserAEC,
             autoGainControl: useBrowserAEC },
    video: false,
  });
  // ⚠️ 必须读**实际生效**的值 —— 浏览器可能忽略/改写请求的约束，
  // 尤其移动端。申请了不等于生效，写日志时要用 getSettings()。
  let actual = {};
  try {
    const tr = micStream.getAudioTracks()[0];
    actual = (tr && tr.getSettings) ? tr.getSettings() : {};
  } catch (e) { /* ignore */ }
  // 供「导出诊断」用 —— 真机排查时"申请了什么"与"实际生效什么"经常不同
  window._lastMicSettings = actual;
  log('k', `麦克风约束：请求 echoCancellation=${useBrowserAEC} `
         + `noiseSuppression=${useBrowserAEC}（模式=${mode}）`);
  log('k', `实际生效：echoCancellation=${actual.echoCancellation} `
         + `noiseSuppression=${actual.noiseSuppression} `
         + `autoGainControl=${actual.autoGainControl} `
         + `sampleRate=${actual.sampleRate} deviceId=${(actual.deviceId||'').slice(0,8)}`);
  if (useBrowserAEC && actual.echoCancellation === false) {
    log('e', '⚠️ 浏览器**拒绝**了 echoCancellation —— 此设备/浏览器上'
           + '原生 AEC 不可用，回声不会被消除');
  }
  videoStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  $('cam').srcObject = videoStream;

  // ⚠️ 采集与播放共用一个 AudioContext（16kHz）。某些移动浏览器不支持
  // 16kHz 的 AudioContext，会退到设备默认率 —— 这没关系，播放器会手动
  // 重采样到 ctx.sampleRate。但如果 context 一直是 suspended（iOS 需要
  // 用户手势），就会「有字幕没声音」。
  audioCtx = new AudioContext({ sampleRate: 16000 });
  diag.ctxState = audioCtx.state;
  diag.ctxRate = audioCtx.sampleRate;
  diagUpdate();
  audioCtx.addEventListener?.('statechange', () => {
    diag.ctxState = audioCtx.state;
    diagUpdate();
    if (audioCtx.state === 'suspended') {
      log('e', 'AudioContext 被挂起 —— 点「解锁音频」恢复');
    }
  });
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  diag.ctxState = audioCtx.state;
  diag.ctxRate = audioCtx.sampleRate;
  diagUpdate();
  await audioCtx.audioWorklet.addModule('/static/duplex/lib/capture-processor.js');

  const src = audioCtx.createMediaStreamSource(micStream);
  const chunkSize = Math.max(160, Math.floor(audioCtx.sampleRate / 10)); // 100ms
  workletNode = new AudioWorkletNode(audioCtx, 'capture-processor',
                                     { processorOptions: { chunkSize } });
  const sink = audioCtx.createGain(); sink.gain.value = 0;
  src.connect(workletNode); workletNode.connect(sink); sink.connect(audioCtx.destination);
  log('k', '采集启动：chunkSize=' + chunkSize + ' (' +
      (chunkSize / audioCtx.sampleRate * 1000).toFixed(0) + 'ms)');

  const cv = $('cv'), ctx2d = cv.getContext('2d'), video = $('cam');

  function grab(maxW, maxH, q) {
    if (!video.videoWidth) return null;
    const vw = video.videoWidth, vh = video.videoHeight;
    const s = Math.min(1, maxW / vw, maxH / vh);
    cv.width = Math.round(vw * s); cv.height = Math.round(vh * s);
    ctx2d.drawImage(video, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', q).split(',')[1] || null;
  }

  workletNode.port.onmessage = (ev) => {
    if (!running || ev.data.type !== 'chunk') return;
    frameCounter = (frameCounter + 1) % 10;   // 10 块 = 1s
    session && session.sendChunk({
      audio: ev.data.audio,
      frameBase64: grab(320, 240, 0.5),                    // 人脸 25fps
      frameOmniBase64: frameCounter === 0 ? grab(1280, 720, 0.7) : null, // Omni 1fps
    });
  };
  workletNode.port.postMessage({ command: 'start' });
}

/* ---------- 人脸叠加绘制 ----------
 * ⚠️ 框坐标基于**服务端实际收到的帧尺寸**，必须用它做映射。
 * 曾写死 640×480，而实际喂的是 320×240 —— 位置与尺寸都变成一半，
 * 表现为"框在左上角且比脸小很多"。
 * 服务端在每条 face.state 里带 src_w/src_h。
 */
function drawFace(m) {
  const video = $('cam'), ov = $('overlay');
  const w = video.clientWidth || 320;
  const h = video.clientHeight || 240;
  if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
  const ctx = ov.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  const t = (m.tracks && m.tracks[0]) || null;
  const id = m.identity || null;
  const wake = m.wake || null;

  // 源分辨率优先用服务端下发的；缺失时退回采集分辨率
  const srcW = (t && t.src_w) || 320;
  const srcH = (t && t.src_h) || 240;
  const sx = w / srcW, sy = h / srcH;

  if (t && t.valid && t.box) {
    const [l, tp, r, b] = t.box;
    const x = l * sx, y = tp * sy;
    const bw = (r - l) * sx, bh = (b - tp) * sy;

    // 唤醒中：绿框；否则黄框
    ctx.strokeStyle = t.interacting ? '#22c55e' : '#eab308';
    ctx.lineWidth = t.interacting ? 3 : 2;
    ctx.strokeRect(x, y, bw, bh);

    // 标签：置信度 + 唇动 + 身份
    const parts = [t.score.toFixed(2)];
    if (t.speaking) parts.push('说话中');
    else parts.push(t.lip || 'SILENT');
    if (id && id.enrolled && id.name) parts.push(id.name);
    else if (id && id.uid) parts.push('未注册');
    if (t.interacting) parts.push('✓唤醒');
    const label = parts.join(' · ');

    ctx.font = '600 13px ui-monospace, monospace';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x, Math.max(0, y - 20), tw + 10, 19);
    ctx.fillStyle = t.interacting ? '#86efac' : '#fde68a';
    ctx.fillText(label, x + 5, Math.max(14, y - 6));
  }

  // 文本面板
  const fi = $('faceinfo');
  if (!t || !t.valid) {
    fi.textContent = '人脸：未检测到';
  } else {
    fi.innerHTML =
      `人脸：<b>检测到</b>  置信度 <b>${t.score.toFixed(3)}</b>  ` +
      `唇动 <b>${t.speaking ? '说话中' : (t.lip || 'SILENT')}</b>  ` +
      `唤醒 <b>${t.interacting ? '是' : '否'}</b>` +
      (wake ? `  （最近唤醒 ${wake.phase} dwell=${wake.dwell_ms}ms）` : '') +
      `<br>身份：` +
      (id
        ? (id.enrolled
            ? `<b>${id.name || '?'}</b>  uid=${id.uid}  sim=${id.similarity}`
            : `不在库（sim=${id.similarity}）`)
        : '尚未识别');
  }
  if (t) evtCounts['face.state'] = (evtCounts['face.state'] || 0) + 1;
}

/* ---------- 统计 ---------- */
let evtCounts = {};
function refreshStats() {
  if (!session) return;
  const s = session.stats;
  const evs = Object.entries(evtCounts)
    .map(([k, v]) => k + '=' + v).join(' ');
  statsEl.textContent =
    `会话 ${session.sessionId || '-'}  ready=${session.ready}\n` +
    `音频块 ${s.audioSent}  人脸帧 ${s.faceFramesSent}  Omni帧 ${s.omniFramesSent}\n` +
    `TTS ${s.ttsFrames} 帧 / ${(s.ttsBytes / 2 / 24000).toFixed(2)}s\n` +
    `事件: ${evs}`;
}

/* ---------- 会话 ---------- */
$('btnStart').onclick = async () => {
  try {
    $('btnStart').disabled = true;
    running = true;
    await startCapture();
    const player = new PcmPlayer(audioCtx);
    session = new OrchestratorSession({
      player,
      onEvent: (m) => {
        evtCounts[m.type] = (evtCounts[m.type] || 0) + 1;
        if (m.type === 'asr') {
          // 服务端已把增量片段拼成累积文本，这里**替换**显示即可
          $('asrline').innerHTML = '<b>ASR</b> ' +
            (m.phase === 'partial' ? '<i>' : '') + (m.text || '') +
            (m.phase === 'partial' ? '</i>' : '');
        } else if (m.type === 'tts.start') {
          // 完整显示，不截断 —— 早先限制 80 字，长回复的字幕被砍掉。
          // 用独立区域追加（ASR 的替换不会冲掉这里）。
          const log = $('ttslog');
          if (log.textContent.startsWith('（等待')) log.textContent = '';
          const d = document.createElement('div');
          d.style.marginBottom = '6px';
          d.innerHTML = '<b>播报</b> ' + (m.text || '');
          log.appendChild(d);
          log.scrollTop = log.scrollHeight;
        } else if (m.type === 'face.state') {
          drawFace(m);
        } else if (m.type === 'session.stats') {
          renderDelay(m);
        } else if (m.type === 'error') {
          log('e', 'ERROR ' + m.code + ': ' + m.message);
        } else if (m.type === 'tts.audio') {
          diag.frames += 1;
          diag.bytes += Math.floor((m.audio_base64 || '').length * 3 / 4);
          if (diag.ctxState === 'suspended') {
            // 音频被浏览器挂起了 —— 这是"有字幕没声音"的头号原因
            diag.lastErr = 'AudioContext suspended（点「解锁音频」）';
          }
          diagUpdate();
        } else {
          log('v', m.type + ' ' + JSON.stringify(m).slice(0, 100));
        }
        refreshStats();
      },
      onOpen: (m) => log('v', 'session.ready id=' + m.session_id),
      onClose: () => { log('e', '连接关闭'); running = false; },
      onError: (e) => log('e', 'WS 错误'),
    });
    const aecMode = selectedAecMode();
    await session.start({
      identity: { page: 'orchestrator-test', device_id: deviceKey() },
      aec_mode: aecMode,
    });
    log('v', `会话已建立（回声消除=${aecMode}）`);
    if (aecMode === 'service') {
      log('m', '已选算法服务 AEC —— 建议先点「校准延迟」，否则第一句播报消得不准');
    }
    log('v', '会话已建立');
    refreshStats();
  } catch (e) {
    log('e', '启动失败：' + e.message);
    $('btnStart').disabled = false;
    running = false;
  }
};

/* 音频解锁：移动浏览器（iOS 尤其）要求 AudioContext 在**用户手势**中
 * resume()，否则一直是 suspended —— 表现为"有字幕没声音"。 */
$('btnUnlock').onclick = async () => {
  if (!audioCtx) { log('e', '请先点「开始会话」'); return; }
  try {
    if (audioCtx.state !== 'running') await audioCtx.resume();
    diag.ctxState = audioCtx.state;
    diag.ctxRate = audioCtx.sampleRate;
    diagUpdate();
    log('v', `音频已解锁：state=${audioCtx.state} rate=${audioCtx.sampleRate}`);
    // 播一个短促提示音，确认真的出声
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    g.gain.value = 0.08;
    o.frequency.value = 880;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.25);
    log('v', '已播放 880Hz 提示音（0.25s）—— 应能听到');
  } catch (e) {
    log('e', '解锁失败：' + e.message);
  }
};

/* 延迟校准 —— **独立于会话**。
 *
 * 不需要"开始会话"：校准只要"播一段已知音频 → 收麦克风 → 算互相关"，
 * 与 ASR/OmniLLM/TTS 无关。走独立 WS 通道 /v1/calibrate，约 3 秒完成。
 *
 * 关键：校准期间**必须关闭浏览器 AEC**（否则回声在设备侧被消掉，
 * 测到的"延迟"是错的），且必须**外放**（戴耳机没有回声路径）。 */
$('btnCalib').onclick = async () => {
  const btn = $('btnCalib');
  btn.disabled = true;
  let ws = null, mic = null, ctx = null, worklet = null;
  try {
    // ⚠️ **AudioContext 必须在用户手势的同步处理链中创建**。
    // 移动端（尤其 iOS）里，若先 `await getUserMedia` 再建 AudioContext，
    // 手势上下文已失效 —— context 会被挂起或音量极低，**校准音根本没响**。
    // 那会让麦克风收不到回声，表现为 mic_rms 极低、校准必然失败。
    //
    // 也不能强制 sampleRate:16000（很多移动设备只支持 44.1k/48k）。
    // 播放时按 ctx.sampleRate 重采样即可。
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    // 同一个手势里立刻 resume（必须同步链路，不能等 await）
    const resumeP = (ctx.state === 'suspended') ? ctx.resume() : Promise.resolve();

    // 1) 麦克风：**关掉 AEC/NS**，只要原始信号（才含真实回声）
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false,
               noiseSuppression: false, autoGainControl: false },
      video: false,
    });
    await resumeP;
    log('v', `校准用 AudioContext：${ctx.state} @${ctx.sampleRate}Hz`);
    if (ctx.state !== 'running') {
      log('e', '⚠️ AudioContext 未运行 —— 校准音可能不会播放，'
             + '请确认已授权并且不是静音模式');
    }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/v1/calibrate`);
    await new Promise((res, rej) => {
      ws.onopen = res;
      ws.onerror = () => rej(new Error('无法连接校准通道'));
    });
    // ⚠️ **必须先注册 onmessage，再发 start**。
    // 服务端加载完音频只要 ~5ms 就回消息，而 onmessage 赋值前到达的消息
    // 会被直接丢弃 —— 早先就是先发后注册，导致校准音频永远收不到、
    // 前端 20s 超时（服务端侧表现为"一直等麦克风数据"）。
    // ⚠️ **先把采集链路搭好**（AudioWorklet 加载是异步的，放 onmessage
    // 里会拖到播放之后才开始录，而且 onmessage 里的 await 会让后续逻辑
    // 与 timeout 竞争）。现在：建好采集 → 收到音频 → 立刻播放。
    await ctx.audioWorklet.addModule('/static/duplex/lib/capture-processor.js');
    const micSrc = ctx.createMediaStreamSource(mic);
    // ⚠️ chunkSize 按 ctx 实际采样率取"100ms" —— 服务端就是按 16k/100ms
    // 的节奏理解回传数据的。固定写 1600 在 48k 设备上只有 33ms/块。
    worklet = new AudioWorkletNode(ctx, 'capture-processor',
                                   { processorOptions: {
                                       chunkSize: Math.max(
                                         160, Math.round(ctx.sampleRate / 10)) } });
    const sink = ctx.createGain(); sink.gain.value = 0;
    micSrc.connect(worklet); worklet.connect(sink); sink.connect(ctx.destination);

    // ⚠️ **复用与 TTS 完全相同的播放器**，而不是另写一份播放代码。
    // 早先校准自己写了一套「收到就 src.start()、不预留提前量」的播放，
    // 而 TTS 走 PcmPlayer（预留 200ms）。两条路径的播放时刻不同，测出的
    // 延迟无法迁移到实际会话 —— 这是校准"测了没用"的根源之一。
    // 现在同一个 PcmPlayer、同一份重采样、同一个 AudioContext。
    const calPlayer = new PcmPlayer(ctx);
    // 麦克风流的起点（ctx 秒）—— 锚点要相对它计算
    let captureStartCtx = null;
    let anchorSent = false;
    // 保存本次校准的原始麦克风（16k）与播放信号 —— 供「导出校准录音」。
    // 目的：真机上"回声没进麦克风"这件事，只有拿到原始波形才能确诊
    // （是没播出来？音量太小？还是被设备侧处理掉了？）。
    calCapture = { mic: [], chirp: null, sampleRate: 16000,
                   anchor: null, result: null };

    const result = await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('校准超时')), 30000);
      let playing = false;
      let micChunks = 0;
      let micSent = 0;

      worklet.port.onmessage = (e) => {
        if (e.data.type !== 'chunk') return;
        micChunks += 1;
        if (captureStartCtx === null) captureStartCtx = ctx.currentTime;
        // ⚠️ 全程回传（不等播放开始）—— 服务端用锚点定位播放时刻，
        //    锚点相对采集起点，所以采集必须先于播放并持续覆盖。
        if (!playing || ws.readyState !== WebSocket.OPEN) return;
        // ⚠️ **必须重采样到 16kHz** 再回传。早先直接回传 ctx 原始率的
        //    数据（通常 48k），而服务端按 16k 解析 —— 时间尺度整体错 3 倍。
        const a16 = resampleTo16k(e.data.audio, ctx.sampleRate);
        if (calCapture) calCapture.mic.push(new Float32Array(a16));
        const ab = new ArrayBuffer(a16.length * 4);
        new Float32Array(ab).set(a16);
        ws.send(JSON.stringify({
          type: 'calibrate.mic',
          sample_rate: 16000,
          audio_base64: b64FromBuffer(ab),
        }));
        micSent += 1;
      };
      worklet.port.postMessage({ command: 'start' });

      ws.onmessage = (ev) => {
       try {
        const m = JSON.parse(ev.data);
        if (m.type === 'calibrate.play') {
          log('v', `收到校准音频 ${m.duration_s.toFixed(1)}s（${m.segments || 1} 段）`
                 + ` —— 正在播放，请保持安静（外放，别戴耳机）`);
          // 解码 int16 → float32，交给与 TTS 相同的播放器
          const bin = atob(m.audio_base64);
          const n = bin.length >> 1;
          const f32 = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            const v = (bin.charCodeAt(i*2) | (bin.charCodeAt(i*2+1) << 8)) << 16 >> 16;
            f32[i] = v / 32768;
          }
          playing = true;
          // 留档：播放信号（16k）+ 样本率，供导出时对齐比较
          if (calCapture) {
            const c = new Float32Array(f32.length);
            c.set(f32);
            calCapture.chirp = resampleTo16k(c, m.sample_rate);
            calCapture.chirpRate = m.sample_rate;
          }
          // beginResponse 会预留 200ms 提前量（与 TTS 一致）
          calPlayer.beginResponse('cal', m.sample_rate);
          const at = calPlayer.playFloat32(f32, m.sample_rate);
          // ⚠️ 上报**真实起播锚点**：起播时刻相对采集起点的采样数。
          //    同一 AudioContext 内取差 —— 精确、与设备采样率无关、
          //    无网络竞态。服务端据此定位播放时刻，不再靠猜的常量。
          if (captureStartCtx !== null && !anchorSent) {
            anchorSent = true;
            const off = Math.max(0, Math.round((at - captureStartCtx) * 16000));
            if (calCapture) calCapture.anchor = off;
            ws.send(JSON.stringify({
              type: 'calibrate.anchor', play_offset_samples: off,
            }));
            log('v', `已上报起播锚点 ${(off/16000).toFixed(3)}s `
                   + `（ctx 提前量 ${(at - ctx.currentTime).toFixed(3)}s）`);
          }
          log('v', '麦克风正在回传（16kHz）…');
        } else if (m.type === 'calibrate.done' || 'ok' in m) {
          clearTimeout(timeout);
          resolve(m);
        }
       } catch (err) {
         log('e', '处理校准消息出错：' + err.message);
       }
      };

      // ⚠️ handler 注册完毕，**现在**才发 start
      ws.send(JSON.stringify({
        type: 'calibrate.start',
        client_key: deviceKey(),
      }));
      log('v', '已连接校准通道，等待校准音频…');
    });

    if (calCapture) calCapture.result = result;
    if (result.ok) {
      log('v', `✓ 校准完成：声学延迟 ${result.delay_ms.toFixed(1)} ms`
             + `（${result.segments || 1} 段一致，段间差 ${result.spread_ms ?? 0}ms，`
             + `峰比 ${result.peak_ratio ?? '-'}）`);
      log('m', '⚠️ 容忍窗只有约 ±5ms —— 该值已保存，下次会话自动使用');
      // 立刻刷新一次显示（会话中会由 session.stats 推送更新）
      lastCalibResult = result;
    } else {
      log('e', '校准失败：' + (result.error || '未知原因'));
      if (result.sig_rms != null) {
        log('m', `诊断：啁啾段 rms=${result.sig_rms}，`
               + `本底 rms=${result.noise_rms}，`
               + `信噪比 ${result.snr_db ?? '-'}dB，`
               + `峰比 ${result.peak_ratio ?? '-'}，`
               + `段间差 ${result.spread_ms ?? '-'}ms`);
      }
    }
  } catch (e) {
    log('e', '校准失败：' + e.message);
  } finally {
    try { worklet && worklet.port.postMessage({ command: 'stop' }); } catch (x) {}
    try { ws && ws.close(); } catch (x) {}
    try { mic && mic.getTracks().forEach(t => t.stop()); } catch (x) {}
    try { ctx && await ctx.close(); } catch (x) {}
    btn.disabled = false;
  }
};

/** float32 → base64（会话通道用） */
function b64FromF32(a) {
  const ab = new ArrayBuffer(a.length * 4);
  new Float32Array(ab).set(a);
  return b64FromBuffer(ab);
}

/** 线性重采样到 16kHz。
 *
 *  校准通道**必须**在回传前做这一步：浏览器 AudioContext 的采样率通常是
 *  设备默认的 44.1k/48k，而服务端按 16k 解析 —— 早先直接回传原始率，
 *  时间尺度整体错 3 倍，测出的延迟完全不可用。 */
function resampleTo16k(x, srcRate) {
  srcRate = srcRate || 16000;
  if (!srcRate || Math.abs(srcRate - 16000) < 1) return x;
  const outN = Math.max(1, Math.round(x.length * 16000 / srcRate));
  const out = new Float32Array(outN);
  const ratio = x.length / outN;
  for (let i = 0; i < outN; i++) {
    const p = i * ratio, i0 = Math.floor(p),
          i1 = Math.min(i0 + 1, x.length - 1), fr = p - i0;
    out[i] = x[i0] * (1 - fr) + x[i1] * fr;
  }
  return out;
}

/** ArrayBuffer → base64（校准通道用） */
function b64FromBuffer(buffer) {
  const bytes = new Uint8Array(buffer);
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(s);
}

/* 切换 AEC 模式：会话中可直接切，服务端会启用/停用云端 AEC */
$('aecMode').onchange = () => {
  const m = selectedAecMode();
  log('v', `回声消除模式 → ${m}`);
  if (session && session.ready) {
    session.send({ type: 'set_aec_mode', mode: m });
    if (m === 'service') {
      log('m', '算法服务 AEC 需要延迟校准 —— 建议点「校准延迟」');
    }
  }
};

/* 导出校准录音 —— 麦克风原始波形 + 播放信号，各存一个 WAV。
 *
 * 为什么需要：真机上"回声没进麦克风"有三个完全不同的原因，从指标上
 * 分不出来，只有看波形才能确诊：
 *   ① 校准音根本没播出来（扬声器静音 / 路由到听筒）
 *   ② 播出来了但音量太小，被环境噪声盖住
 *   ③ 播了也被设备侧处理掉了（iOS 的 play-and-record 音频会话会启用
 *      系统级 VPIO，自带 AEC/降噪，会先把回声消掉再交给页面）
 * 拿到 WAV 后跑 `orchestrator/tests/analyze_calib_wav.py` 即可判定。 */
function writeWav(f32, sampleRate) {
  const n = f32.length;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const str = (off, s) => {
    for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i));
  };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, sampleRate, true);
  v.setUint32(28, sampleRate * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); str(36, 'data');
  v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

$('btnCalibWav').onclick = () => {
  if (!calCapture || !calCapture.mic.length) {
    log('e', '还没有校准录音 —— 请先点「校准延迟」');
    return;
  }
  const mic = concatF32(calCapture.mic);
  const stamp = Date.now();
  downloadBlob(writeWav(mic, calCapture.sampleRate),
               `calib-mic-${stamp}.wav`);
  if (calCapture.chirp) {
    downloadBlob(writeWav(calCapture.chirp, calCapture.sampleRate),
                 `calib-chirp-${stamp}.wav`);
  }
  // 一并存元数据：锚点、结果、设备约束 —— 离线分析要用
  const meta = {
    anchor_samples: calCapture.anchor,
    anchor_s: calCapture.anchor != null ? calCapture.anchor / 16000 : null,
    mic_s: mic.length / 16000,
    mic_peak: Math.max(...Array.from(mic.slice(0, 400000),
                                     x => Math.abs(x))),
    result: calCapture.result,
    mic_constraints: window._lastMicSettings || null,
    ua: navigator.userAgent,
  };
  downloadBlob(new Blob([JSON.stringify(meta, null, 2)],
                        { type: 'application/json' }),
               `calib-meta-${stamp}.json`);
  log('v', `已导出校准录音（mic ${(mic.length/16000).toFixed(1)}s，`
         + `峰值 ${meta.mic_peak.toFixed(4)}）+ 播放信号 + 元数据`);
};

/** 把多个 Float32Array 拼成一个 */
function concatF32(chunks) {
  let n = 0;
  for (const c of chunks) n += c.length;
  const out = new Float32Array(n);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

/* 导出诊断 —— 把本次会话的**实际链路状态**落到本地文件。
 *
 * 动机：真机上"回声没消掉"这件事在服务器日志里只能看间接指标（ERLE、
 * D、farend 非零占比）。有了这份快照，就能拿它回灌离线 harness 复算，
 * 把真机问题变成可复现的实验 —— 而不是只能靠"听"来判断。
 *
 * 数据量刻意做小（不含原始音频）：环境、约束、D、ERLE、日志即可定位
 * 绝大多数问题。 */
$('btnExport').onclick = () => {
  const dump = {
    exported_at: new Date().toISOString(),
    page: location.href,
    ua: navigator.userAgent,
    device_key: deviceKey(),
    aec_mode: selectedAecMode(),
    audio: {
      ctx_state: diag.ctxState,
      ctx_rate: diag.ctxRate,
      tts_frames: diag.frames,
      tts_seconds: +(diag.bytes / 2 / 24000).toFixed(2),
      scheduled: diag.scheduled,
      peak: diag.peak,
      started_at: diag.startedAt,
      last_err: diag.lastErr,
    },
    mic_constraints: window._lastMicSettings || null,
    last_stats: lastStats,
    last_calibration: lastCalibResult,
    event_counts: evtCounts,
    log: Array.from(logEl.children).slice(-300)
              .map(d => d.textContent),
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)],
                        { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `orch-diag-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  log('v', '诊断已导出（含环境/约束/D/ERLE/日志，不含原始音频）');
};

$('btnStop').onclick = async () => {
  running = false;
  if (workletNode) { try { workletNode.port.postMessage({ command: 'stop' }); } catch (e) {} }
  if (session) await session.stop('user_stop');
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  if (audioCtx) await audioCtx.close();
  workletNode = null; session = null;
  $('btnStart').disabled = false;
  log('v', '已停止');
};

initAecMode();
log('k', `就绪。当前回声消除模式：${selectedAecMode()}`
       + `（选算法服务请先点「校准延迟」）`);
</script>
