<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orchestrator 前端验证</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px/1.6 -apple-system, "Segoe UI", sans-serif; margin: 0;
         background: #111; color: #e6e6e6; }
  .wrap { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  .col { flex: 1 1 380px; min-width: 320px; }
  video { width: 100%; border-radius: 8px; background: #000; }
  /* 视频 + 人脸叠加层 */
  .stage { position: relative; line-height: 0; }
  .stage canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%;
                          border-radius: 8px; pointer-events: none; }
  button { padding: 10px 18px; font-size: 15px; border-radius: 8px;
           border: 1px solid #444; background: #2a2a2a; color: #e6e6e6;
           cursor: pointer; margin-right: 8px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.danger  { background: #b91c1c; border-color: #b91c1c; }
  .log { height: 340px; overflow-y: auto; background: #1a1a1a;
         border: 1px solid #333; border-radius: 8px; padding: 10px;
         font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .log div { margin-bottom: 3px; word-break: break-all; }
  .k { color: #7dd3fc; }  .v { color: #86efac; }  .e { color: #fca5a5; }
  .m { color: #fcd34d; }
  .stats { font-family: ui-monospace, monospace; font-size: 12px;
           background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
           padding: 10px; margin-top: 10px; }
  /* 字幕区：长回复要能完整显示并可滚动（早先限高+截断，长回复看不全） */
  .sub { margin-top: 10px; min-height: 60px; max-height: 300px;
         overflow-y: auto; background: #1a1a1a;
         border: 1px solid #333; border-radius: 8px; padding: 10px;
         line-height: 1.6; word-break: break-word; }
  h3 { margin: 0 0 8px; font-size: 14px; color: #aaa; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <h3>摄像头（人脸框叠加）</h3>
    <div class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <canvas id="cv" style="display:none"></canvas>
    <div class="stats" id="faceinfo">人脸：等待中…</div>
    <div style="margin-top:12px">
      <label style="display:block;margin-bottom:8px">
        回声消除：
        <!-- 默认 service（与后端 ORCH_AEC_MODE 默认一致）。
             选了会记住（localStorage），刷新后保持上次的选择。 -->
        <select id="aecMode">
          <option value="service">算法服务 AEC</option>
          <option value="browser">浏览器原生 AEC（不受网络延迟影响）</option>
          <option value="off">不做回声消除</option>
        </select>
      </label>
      <button id="btnStart" class="primary">开始会话</button>
      <button id="btnStop" class="danger">停止</button>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#888">
      算法服务 AEC 需要 <b>外放</b>（戴耳机没有回声路径）。「延迟」面板显示
      当前 D 与落位锚点来源；「音频」面板显示<b>设备输出延迟</b> ——
      它和 D 是绑在一起的，<b>中途跳变就说明音频会话被重建了</b>，
      固定 D 随即失效（日志里会打 <code>[音频会话]</code>）。
    </div>
    <div class="stats" id="delayinfo">延迟：未测量</div>
    <div class="stats" id="audiostat">音频：未开始</div>
    <div class="stats" id="stats">未开始</div>
  </div>
  <div class="col">
    <h3>字幕 / 事件</h3>
    <!-- ASR 与 TTS 分两个区域：ASR 是**替换**语义（流式刷新同一行），
         TTS 是**追加**语义（多轮累积）。早先共用一个元素，ASR 的替换
         会把播报记录冲掉。 -->
    <div class="sub" id="subtitle">
      <div id="asrline">（等待 ASR 输出）</div>
    </div>
    <h3 style="margin-top:10px">播报记录</h3>
    <div class="sub" id="ttslog">（等待播报）</div>
    <h3 style="margin-top:14px">事件日志</h3>
    <div class="log" id="log"></div>
  </div>
</div>

<!-- ⚠️ 版本查询串同 worklet：iOS Safari 没有强制刷新，改了这个文件就必须
     改号，否则页面拿到新 HTML、脚本还是旧的（「能力位对、锚点却是 0 个」
     就是这么来的）。 -->
<script src="/static/duplex/lib/orchestrator-session.js?v=5"></script>
<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log'), statsEl = $('stats');
let session = null, micStream = null, audioCtx = null, workletNode = null;
let videoStream = null, running = false, frameCounter = 0;
/** 采集侧 AudioContext 的代号 —— 服务端据此丢弃换 context 前的锚点 */
let audioEpoch = 0;

/**
 * 把 ASR 消息里的 `state` 渲染成一行小标签。
 *
 * 五个量都是离散档位（HIGH/MEDIUM/LOW/NONE），由服务端 AsrStateTracker 归纳：
 *   说 = user_speaking_confidence   用户正在出声的把握
 *   抢 = barge_in_confidence        抢话轮的把握（按本轮已识别字数爬档）
 *   信 = asr_confidence             本轮转写置信度
 *   完 = turn_complete_confidence   本轮已说完的把握
 * `transcript` 不在这里显示 —— 它就是 asrline 上那行文本。
 */
function asrStateTag(s) {
  if (!s) return '';
  const c = (v) => ({
    HIGH: '#4caf50', MEDIUM: '#ffb300', LOW: '#ff7043', NONE: '#666',
  }[v] || '#666');
  const item = (label, v) =>
    `<span style="color:${c(v)}">${label}:${v || '-'}</span>`;
  return ' <small style="opacity:.85">[' +
    [item('说', s.user_speaking_confidence),
     item('抢', s.barge_in_confidence),
     item('信', s.asr_confidence),
     item('完', s.turn_complete_confidence)].join(' ') +
    ']</small>';
}

function log(cls, msg) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild);
}

/* ---------- 播放器：PCM16 24kHz → WebAudio，并暴露 ctx 时间供回执 ---------- */
/* 播放诊断：把每一步的可疑点暴露到页面上。
 * 远程调试时看不到控制台，必须让状态可见。 */
const diag = {
  ctxState: '-', ctxRate: '-', frames: 0, bytes: 0,
  scheduled: 0, startedAt: '-', lastErr: '-', peak: 0,
};
function diagUpdate() {
  const el = $('audiostat');
  if (!el) return;
  // ⚠️ outputLatency 是 D 里**会变的那部分**。它一跳，D 就跳，固定 D 的
  //    AEC 随即失效 —— 所以必须让它在页面上直接可见，不用用户做任何操作。
  const lat = audioCtx
    ? `　设备输出延迟 <b>${fmtLat(audioCtx.outputLatency)}</b>`
      + `（base ${fmtLat(audioCtx.baseLatency)}）`
    : '';
  el.innerHTML =
    `AudioContext: <b>${diag.ctxState}</b> @${diag.ctxRate}Hz${lat}　` +
    `TTS 帧 <b>${diag.frames}</b> / ${(diag.bytes/2/24000).toFixed(2)}s　` +
    `已调度 <b>${diag.scheduled}</b>　峰值 ${diag.peak.toFixed(3)}<br>` +
    (diag.startedAt !== '-' ? `起播时刻 ${diag.startedAt}<br>` : '') +
    (diag.lastErr !== '-' ? `<span style="color:#fca5a5">错误: ${diag.lastErr}</span>` : '');
}

/** 设备报告的延迟格式化（n/a 表示浏览器没提供）。 */
function fmtLat(v) {
  return (v == null || !isFinite(v)) ? 'n/a' : (v * 1000).toFixed(1) + 'ms';
}
/** 音频会话事件记录 —— 排查"D 为什么中途变了"用。
 *  D 跳变时，outputLatency / ctx 状态 / devicechange 里必有一个同步变化。 */
window._latencyLog = [];
function trackLatencyShift() {
  try {
    if (!audioCtx) return;
    window._latencyLog.push({
      t: audioCtx.currentTime, state: audioCtx.state,
      output: audioCtx.outputLatency, base: audioCtx.baseLatency,
    });
    if (window._latencyLog.length > 60) window._latencyLog.shift();
  } catch (e) { /* ignore */ }
}

class PcmPlayer {
  constructor(ctx) {
    this.ctx = ctx;
    this.nextAt = 0;
    this.responseId = null;
    this.srcRate = 24000;       // 服务端 TTS 输出采样率
    this._sources = [];         // 已排程的源，stop() 要逐个掐断
    this._cancelled = false;    // 上一句是否被 cancel（决定下一句是否重排）
    this._armed = 0;            // 本句**承诺**的起播时刻（ctx 秒）
    this._firstAt = 0;          // 本句**实际**首播时刻（ctx 秒）
    this.gain = ctx.createGain();
    this.gain.gain.value = 1.0;
    this.gain.connect(ctx.destination);
    // 保活节点：某些移动浏览器在没有持续音源时会挂起 context
    this._keep = ctx.createConstantSource
      ? ctx.createConstantSource() : null;
    if (this._keep) {
      this._keep.offset.value = 0;
      this._keep.connect(ctx.destination);
      this._keep.start();
    }
  }
  now() { return this.ctx.currentTime; }

  /** 本句**实际播出了多少采样**（16k 基准）。
   *
   *  这是参考轨该保留的长度 —— 用**音频时钟**算，不是猜。
   *
   *  ⚠️ 为什么需要它：参考轨早先是按"预测"写的 —— 落位时假设浏览器
   *  会在此刻 + playback_delay 起播、并一直播完整段。一旦现实与预测不符
   *  （打断后旧句照播、或浏览器延迟起播），写进轨的就是**没播过的音频**，
   *  AEC 拿着它对消实际的回声，自然全错。
   *
   *  这里改为**观测**：遍历已排程的源，按 ``ctx.currentTime`` 算出每一块
   *  真正播出去的比例（整块 = 播放起点到终点；未起播 = 0；播到一半 =
   *  实际占比），求和即"播出了多少"。
   */
  playedSamples() {
    const now = this.ctx.currentTime;
    let played = 0;
    for (const n of (this._sources || [])) {
      if (n._playedFull) {                       // 已自然播完
        played += n._dur;
      } else if (now > n._at) {                  // 正在播 / 播到中途被打断
        played += Math.min(n._dur, now - n._at);
      }
      // now <= n._at：还没起播 → 不计
    }
    return Math.round(played * 16000);           // 换算到 16k 采样
  }
  /** 开始一个新 response：初始化状态 + 复位排程指针。
   *
   *  ⚠️ **不在这里承诺起播时刻**，见 `_armNow` —— `tts.start` 是服务端在
   *     TTS 合成之前发的，此刻算的"现在 + 提前量"到音频真到时早已过期。
   */
  beginResponse(id, sr, leadMs) {
    this.responseId = id;
    this.srcRate = sr || 24000;
    this._firstAt = 0;
    this._armed = 0;
    this._leadMs = (leadMs == null ? 200 : leadMs);
    if (this._cancelled) {
      // 打断后的新一句：排程指针必须从**当前时刻**重新开始，不能沿用
      // 停在旧句末尾的位置（实测踩过：新句被排到旧句之后，参考轨对不上）
      this.nextAt = 0;
      this._cancelled = false;
    }
  }

  /** 收到**第一块音频**时承诺起播时刻，返回它（0 = 不承诺）。
   *
   *  ⚠️ **必须在这一刻承诺，不能在 `tts.start` 时承诺**。`tts.start` 是在
   *     TTS 合成**之前**发出的（那样这一个往返才能藏在 508ms 合成耗时里），
   *     所以那时算出的「现在 + 提前量」到音频真正到达时**早就过去了** ——
   *     承诺落空，浏览器只能"马上播"，而服务端仍按承诺的旧时刻落位参考轨，
   *     结果参考轨比实际回声**早约 340ms**（真机实测，回声完全消不掉）。
   *     现在承诺的时刻在音频到达之后才计算，必然在未来，兑现得了。
   */
  _armNow() {
    if (this._armed) return this._armed;
    if (this.ctx.state !== 'running') {
      diag.lastErr = 'AudioContext ' + this.ctx.state + ' —— 无法承诺起播';
      diagUpdate();
      return 0;
    }
    this._armed = this.ctx.currentTime + this._leadMs / 1000;
    // 每次起播都记一次设备输出延迟 —— 它变化就说明 I/O 缓冲换了，
    // 而 D 里的"会变的那部分"正是它。与上面的 [音频会话] 日志配对看，
    // 就能把「D 跳变」钉到具体的设备事件上。
    try {
      log('k', `[音频会话] 起播于 ctx=${this._armed.toFixed(3)}s　`
             + `outputLatency=${fmtLat(this.ctx.outputLatency)}　`
             + `baseLatency=${fmtLat(this.ctx.baseLatency)}`);
    } catch (e) { /* ignore */ }
    return this._armed;
  }
  /** 播放一段 int16 base64 PCM。
   *  **手动重采样到 AudioContext 的实际采样率** —— 不用 createBuffer 的
   *  异采样率路径。部分移动浏览器（尤其 Safari 旧版）在 buffer 采样率与
   *  context 不一致时行为不可靠，会静默无声。 */
  playBase64(b64, sr) {
    const bin = atob(b64);
    const n = bin.length >> 1;
    const i16 = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      i16[i] = (bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8)) << 16 >> 16;
    }
    const srcRate = sr || this.srcRate;
    // int16 → float32 + 峰值统计（诊断用：能区分"没送到"与"送到了但没响"）
    let peak = 0;
    const f32src = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const v = i16[i] / 32768;
      f32src[i] = v;
      const a = Math.abs(v);
      if (a > peak) peak = a;
    }
    diag.peak = Math.max(diag.peak, peak);
    return this.playFloat32(f32src, srcRate);
  }
  /** 播放一段 float32 PCM（[-1,1]）。返回**实际起播时刻**（ctx 秒）。
   *
   *  校准通道走这里 —— 与 TTS 共用同一条播放路径（同一份重采样、同一个
   *  提前量、同一个 AudioContext），否则测出的延迟无法迁移到实际会话。 */
  playFloat32(f32src, srcRate) {
    const n = f32src.length;
    const ctxRate = this.ctx.sampleRate;

    // 线性重采样到 context 采样率
    let f32 = f32src, rate = srcRate;
    if (ctxRate && Math.abs(ctxRate - srcRate) > 1) {
      const outN = Math.max(1, Math.round(n * ctxRate / srcRate));
      f32 = new Float32Array(outN);
      const ratio = n / outN;
      for (let i = 0; i < outN; i++) {
        const p = i * ratio;
        const i0 = Math.floor(p), i1 = Math.min(i0 + 1, n - 1);
        const fr = p - i0;
        f32[i] = f32src[i0] * (1 - fr) + f32src[i1] * fr;
      }
      rate = ctxRate;
    }

    const buf = this.ctx.createBuffer(1, f32.length, rate);
    buf.copyToChannel(f32, 0);
    const node = this.ctx.createBufferSource();
    node.buffer = buf;
    node.connect(this.gain);
    // 本句**首块**：在这里承诺起播时刻（音频已到，承诺必然兑现）。
    //
    // ⚠️ 只有首块能取 `_armNow()` 的返回值 —— 它每次调用都返回同一个
    //    缓存的承诺值。若把 `_armNow()` 写在 `at` 的表达式里，**每一个
    //    块都会被排到同一时刻**，整段音频叠在一起同时播（听感是"一闪
    //    而过、只听到开头结尾"）。后续块必须走 `nextAt` 顺排。
    let at;
    if (!this._firstAt) {
      at = this._armNow() || (this.ctx.currentTime + 0.02);
    } else {
      at = Math.max(this.nextAt, this.ctx.currentTime + 0.02);
    }
    node.start(at);
    if (!this._firstAt) this._firstAt = at;   // 本句实际首播时刻
    // 登记已排程的源 —— stop() 要能逐个掐断（WebAudio 不能"取消 start"，
    // 只能对源调 stop()），并据 `_at`/`_dur` **算出实际播出了多少**。
    // 播完的自己摘掉，避免数组无限增长。
    if (!this._sources) this._sources = [];
    node._at = at;
    node._dur = buf.duration;
    this._sources.push(node);
    node.onended = () => {
      node._playedFull = true;          // 自然播完 → 整块都算播过
      const i = this._sources.indexOf(node);
      if (i >= 0) this._sources.splice(i, 1);
    };
    this.nextAt = at + buf.duration;
    this.lastStartAt = at;      // 最近一块的起播时刻（ctx 秒）
    diag.scheduled += 1;
    if (diag.startedAt === '-') {
      diag.startedAt = `+${(at - this.ctx.currentTime).toFixed(2)}s`;
    }
    diagUpdate();
    return at;
  }
  endResponse() { /* 队列自然播完 */ }
  /** 立刻停止播放并清空已排程的内容。
   *
   *  ⚠️ 早先这个函数是**空操作**：把 gain 设 0 又立刻设回 1（等于没做），
   *  而且 `node.start(at)` 一旦调用，已排程的 buffer **必然会播** ——
   *  WebAudio 没有"取消已 start 的源"的接口。结果就是"打断了但旧句还在
   *  响"，新回复的参考轨与实际播出对不上，回声全部漏给 ASR。
   *
   *  正确的做法：
   *    ① 记录每一个已排程的源，逐个 `stop(0)` 掐断（对已排程未播的源
   *       也是有效的 —— stop 会取消它）
   *    ② 把 gain 短暂置 0 兜住 stop(0) 可能残留的几十微秒
   *    ③ 复位排程指针，让下一句从"现在"开始
   */
  stop() {
    // 掐断之前先记下"播了多少" —— 回执要用它告诉服务端参考轨该保留多长
    // （见 session.on_playback_receipt / playedSamples）。
    this._playedOnStop = this.playedSamples();
    for (const n of (this._sources || [])) {
      try { n.stop(0); } catch (e) { /* 已播完的源 stop 会抛，忽略 */ }
      try { n.disconnect(); } catch (e) { /* ignore */ }
    }
    this._sources = [];
    // ⚠️ 不要再动 gain 做"静音"：`stop(0)` 已经掐断了源，gain 是**共享**
    //    的（下一句也走它），把它短暂置 0 会把紧随其后的新句一起消音。
    //    早先那版"gain 设 0 又立刻设回 1"虽然没有这个副作用，但那是因为
    //    它压根没生效（等于空操作）。
    this.nextAt = this.ctx.currentTime + 0.05;
    this._cancelled = true;    // 告诉 beginResponse：下一句从零重排
    diagUpdate();
  }
}

/* ---------- AEC 模式 / 延迟显示 ---------- */
const AEC_MODE_KEY = 'orch_aec_mode';

function selectedAecMode() {
  const el = $('aecMode');
  return el ? el.value : 'service';
}

/** 恢复上次选择（刷新后保持），并绑定变更持久化。 */
function initAecMode() {
  const el = $('aecMode');
  if (!el) return;
  try {
    const saved = localStorage.getItem(AEC_MODE_KEY);
    if (saved) el.value = saved;
  } catch (e) { /* ignore */ }
  // onchange 在别处已绑（切换逻辑），这里只加持久化
  el.addEventListener('change', () => {
    try { localStorage.setItem(AEC_MODE_KEY, el.value); } catch (e) {}
  });
}

/** 设备标识：用于让服务端记住这台设备的延迟（下次冷启动即准）。 */
function deviceKey() {
  let k = localStorage.getItem('orch_device_key');
  if (!k) {
    k = 'dev_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('orch_device_key', k);
  }
  return k;
}

/** 显示服务端推来的链路状态（重点是声学延迟与落位锚点）。 */
let lastStats = null;
// 实测容忍窗：D 偏 5ms 就开始掉，偏 166ms 完全失效
// （见 tests/test_aec_live_fidelity.py 的扫描表）
const DELAY_TOLERANCE_MS = 5;

function renderDelay(s) {
  lastStats = s;
  const el = $('delayinfo');
  if (!el) return;
  const modeName = { browser: '浏览器原生', service: '算法服务', off: '关闭' };
  const srcName = { stored: '已实测（历史记录）', default: '默认值（未实测）',
                    manual: '手动设置', client: '前端上报' };
  let html =
    `回声消除：<b>${modeName[s.aec_mode] || s.aec_mode}</b>　` +
    `声学延迟 D：<b>${s.delay_ms.toFixed(1)} ms</b> ` +
    `（${srcName[s.delay_source] || s.delay_source}）`;
  if (s.aec_mode === 'service') {
    // D 的三态 —— "未实测"必须**显著**，不能显示成一个看似正常的数字。
    // 实测：D 错 166ms（旧默认值 250 vs 真值 84）时回声抑制只有 0.3dB，
    // 等于完全不工作；而 UI 上两者长得一模一样。
    if (s.delay_source === 'default') {
      html += `<br><span style="color:#fca5a5"><b>⚠️ D 尚未实测</b> —— `
            + `现在用的是默认值 ${s.delay_ms.toFixed(0)}ms，`
            + `算法 AEC 大概率**不生效**（容忍窗仅 ±${DELAY_TOLERANCE_MS}ms）。`
            + `请开着转储跑一轮真实会话，再用 `
            + `orchestrator/tests/measure_delay.py 算出本机的 D。</span>`;
    } else {
      html += `<br><span style="color:#86efac">D 已实测</span>`;
      if (s.delay_ms > 400) {
        html += ` <span style="color:#fca5a5">—— 偏大，请确认外放且未戴耳机`
              + `（该值可能是选错峰）</span>`;
      }
    }
  }
  if (s.aec_active) {
    // 落位锚点：这是**回声消不消得掉**的头号指标。
    //   ack       —— 用浏览器承诺的起播时刻精确落位 ✅
    //   predicted —— 服务端用"收到音频的时刻 + 提前量"猜，误差含网络往返、
    //                主线程阻塞、mic 在途积压，**逐句变化**，常量 D 吸收不了
    const anchor = s.anchor_source === 'ack'
      ? `<span style="color:#86efac">浏览器承诺（精确）</span>`
      : (s.anchor_source === 'predicted'
         ? `<span style="color:#fca5a5">服务端预测（不准）</span>`
         : '<span style="color:#888">尚无</span>');
    html += `<br>落位锚点：${anchor}`;
    if (s.anchor_source === 'predicted') {
      html += `<br><span style="color:#fca5a5">参考轨的播出时刻是猜的，`;
      html += `回声对齐会随每句话漂移 —— 这是"第一句能消、后面失效"的根因。`;
      html += `点一下页面（恢复 AudioContext 手势）后重开会话试试。</span>`;
    } else if (s.anchor_source === 'ack' && s.anchor_delta_ms) {
      const bad = Math.abs(s.anchor_delta_ms) > DELAY_TOLERANCE_MS;
      html += `　起播偏差 <b style="color:${bad ? '#fca5a5' : '#86efac'}">`
            + `${s.anchor_delta_ms.toFixed(1)} ms</b>`;
    }
    html += `<br>云端 AEC：工作中，farend 非零占比 `
          + `${(s.ref_nonzero_ratio*100).toFixed(0)}%`;
    if (s.erle_db != null) {
      // 每轮播报独立测量（近端也计入，故绝对值偏低；看**变化**）
      // 参照实测：D 对齐时 10~12dB，错位时 0.3dB。
      const good = s.erle_db >= 6;
      html += `　本轮 ERLE：<b style="color:${good ? '#86efac' : '#fca5a5'}">` +
              `${s.erle_db.toFixed(1)} dB</b>`;
      if (!good) {
        html += `　<span style="color:#fca5a5">← 抑制≈0，AEC 基本没生效：`
              + `多半是 D 不对（容忍窗 ±${DELAY_TOLERANCE_MS}ms）</span>`;
      }
    }
  }
}

/* ---------- 采集 ---------- */
async function startCapture() {
  // 回声消除模式由用户在页面上选（见 #aecMode）——**二选一，不能同时开**：
  //   browser —— 浏览器原生 AEC（设备侧工作，不受网络延迟影响）
  //   service —— 云端算法 AEC（需要参考轨按声学延迟 D 预对齐）
  //   off     —— 都不做（调试）
  //
  // ⚠️ 选 service 时**必须关掉浏览器 AEC**：否则回声在设备侧就被消掉了，
  //    送到云端时已经没有回声，算法 AEC 无从下手 —— 这时"测试云端效果"
  //    实际上是浏览器在做功，结论完全失真。
  // ⚠️ **AGC 也必须关**（早先注释说"AGC 不破坏线性性"是错的）：
  //    AGC 是**时变增益**，它会让扬声器→麦克风这条回声路径的增益随信号
  //    起伏 —— 而算法 AEC 的线性自适应滤波器假定该路径是**线性时不变**
  //    的。AGC 一动，滤波器就追不上，抑制上限被显著拉低。
  //    browser 模式保持原样（原生 AEC 自己能处理 AGC）。
  const mode = selectedAecMode();
  const useBrowserAEC = (mode === 'browser');
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: useBrowserAEC,
             noiseSuppression: useBrowserAEC,
             autoGainControl: useBrowserAEC },
    video: false,
  });
  // ⚠️ 必须读**实际生效**的值 —— 浏览器可能忽略/改写请求的约束，
  // 尤其移动端。申请了不等于生效，写日志时要用 getSettings()。
  let actual = {};
  try {
    const tr = micStream.getAudioTracks()[0];
    actual = (tr && tr.getSettings) ? tr.getSettings() : {};
  } catch (e) { /* ignore */ }
  // 供「导出诊断」用 —— 真机排查时"申请了什么"与"实际生效什么"经常不同
  window._lastMicSettings = actual;
  log('k', `麦克风约束：请求 echoCancellation=${useBrowserAEC} `
         + `noiseSuppression=${useBrowserAEC}（模式=${mode}）`);
  log('k', `实际生效：echoCancellation=${actual.echoCancellation} `
         + `noiseSuppression=${actual.noiseSuppression} `
         + `autoGainControl=${actual.autoGainControl} `
         + `sampleRate=${actual.sampleRate} deviceId=${(actual.deviceId||'').slice(0,8)}`);
  if (useBrowserAEC && actual.echoCancellation === false) {
    log('e', '⚠️ 浏览器**拒绝**了 echoCancellation —— 此设备/浏览器上'
           + '原生 AEC 不可用，回声不会被消除');
  }
  videoStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  $('cam').srcObject = videoStream;

  // ⚠️ 采集与播放共用一个 AudioContext（16kHz）。某些移动浏览器不支持
  // 16kHz 的 AudioContext，会退到设备默认率 —— 这没关系，播放器会手动
  // 重采样到 ctx.sampleRate。但如果 context 一直是 suspended（iOS 需要
  // 用户手势），就会「有字幕没声音」。
  audioCtx = new AudioContext({ sampleRate: 16000 });
  // AudioContext 代号：服务端靠它丢弃"换 context 之前"的锚点
  // （重建后 currentTime 归零，混用会让时钟映射彻底跑偏）。
  audioEpoch = (Date.now() % 2147483647) || 1;
  diag.ctxState = audioCtx.state;
  diag.ctxRate = audioCtx.sampleRate;
  diagUpdate();
  audioCtx.addEventListener?.('statechange', () => {
    diag.ctxState = audioCtx.state;
    diagUpdate();
    // ⚠️ 状态每次变化都要记 —— 它可能是**音频会话重建**的信号，而重建会
    //    让设备的声学延迟 D 整体跳一个值（实测 267→387ms），固定 D 自然
    //    就失效了。这一行是排查"D 为什么中途变了"的第一现场。
    log('m', `[音频会话] AudioContext 状态 → ${audioCtx.state}`
           + `（采样率 ${audioCtx.sampleRate}，`
           + `outputLatency=${fmtLat(audioCtx.outputLatency)}，`
           + `baseLatency=${fmtLat(audioCtx.baseLatency)}）`);
    trackLatencyShift();
    if (audioCtx.state === 'suspended') {
      log('e', 'AudioContext 被挂起 —— 点一下页面任意处恢复');
    }
  });
  // ⚠️ iOS 上音频路由变化（插拔耳机 / 切到听筒 / 其他 App 抢占）会**重建
  //    音频会话**，设备 I/O 缓冲随之改变 —— 这正是 D 跳变的嫌疑来源。
  //    录下来才能把"D 跳变"和"某个设备事件"对上时间。
  navigator.mediaDevices.addEventListener?.('devicechange', () => {
    log('m', '[音频会话] devicechange —— 音频设备列表变了'
           + '（插拔耳机/路由切换会让设备重建，D 可能跳变）');
  });
  // 记录设备报告的输出延迟：它不是 D（D 还含扬声器→麦克风的路程），
  // 但它是 D 里**会变的那部分**，尤其是会话重建前后。
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  // ⚠️ 上面这次 resume 在 `await getUserMedia` 之后，**已经脱离同步用户
  //    手势链**，iOS 上可能无效。补一个一次性手势监听兜底（不需要 UI）。
  if (audioCtx.state !== 'running') {
    document.addEventListener('pointerdown', () => {
      if (audioCtx && audioCtx.state !== 'running') {
        audioCtx.resume().then(() => {
          diag.ctxState = audioCtx.state; diagUpdate();
          log('v', 'AudioContext 已在手势中恢复：' + audioCtx.state);
        }).catch(() => {});
      }
    }, { once: true, capture: true });
  }
  diag.ctxState = audioCtx.state;
  diag.ctxRate = audioCtx.sampleRate;
  diagUpdate();
  // ⚠️ **必须带版本查询串**。iOS Safari 没有"强制刷新"，而且对
  //    AudioWorklet 模块的缓存极其顽固 —— 改了 worklet 代码后，页面
  //    拿到新 HTML 但 worklet 还是旧的，表现为"能力位对、锚点却是 0 个"，
  //    排查起来毫无线索（真机踩过）。改 worklet 内容时**同步改这个号**。
  await audioCtx.audioWorklet.addModule(
    '/static/duplex/lib/capture-processor.js?v=5');

  const src = audioCtx.createMediaStreamSource(micStream);
  const chunkSize = Math.max(160, Math.floor(audioCtx.sampleRate / 10)); // 100ms
  workletNode = new AudioWorkletNode(audioCtx, 'capture-processor',
                                     { processorOptions: { chunkSize,
                                                           epoch: audioEpoch } });
  const sink = audioCtx.createGain(); sink.gain.value = 0;
  src.connect(workletNode); workletNode.connect(sink); sink.connect(audioCtx.destination);
  log('k', '采集启动：chunkSize=' + chunkSize + ' (' +
      (chunkSize / audioCtx.sampleRate * 1000).toFixed(0) + 'ms)');

  const cv = $('cv'), ctx2d = cv.getContext('2d'), video = $('cam');

  function grab(maxW, maxH, q) {
    if (!video.videoWidth) return null;
    const vw = video.videoWidth, vh = video.videoHeight;
    const s = Math.min(1, maxW / vw, maxH / vh);
    cv.width = Math.round(vw * s); cv.height = Math.round(vh * s);
    ctx2d.drawImage(video, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', q).split(',')[1] || null;
  }

  workletNode.port.onmessage = (ev) => {
    if (!running || ev.data.type !== 'chunk') return;
    frameCounter = (frameCounter + 1) % 10;   // 10 块 = 1s
    // ⚠️ **必须重采样到 16kHz 再回传**。设备不认 16kHz 的 AudioContext 时会
    //    退到 44.1k/48k，此时每块是 4410/4800 个采样，而服务端
    //    ``_normalize_chunk`` 会把超过 1600 的部分**截断** —— 时间轴整体
    //    错 3 倍，参考轨的锚点换算也就全废了。
    //    用跨块保持的分数相位累加器（见 resampleChunk16k），避免长期漂移。
    const a16 = resampleChunk16k(ev.data.audio, audioCtx.sampleRate);
    session && session.sendChunk({
      audio: a16,
      ctxTime: ev.data.t0,                                 // 本块首采样的 ctx 时刻
      frameBase64: grab(320, 240, 0.5),                    // 人脸 25fps
      frameOmniBase64: frameCounter === 0 ? grab(1280, 720, 0.7) : null, // Omni 1fps
    });
  };
  workletNode.port.postMessage({ command: 'start' });
}

/* ---------- 人脸叠加绘制 ----------
 * ⚠️ 框坐标基于**服务端实际收到的帧尺寸**，必须用它做映射。
 * 曾写死 640×480，而实际喂的是 320×240 —— 位置与尺寸都变成一半，
 * 表现为"框在左上角且比脸小很多"。
 * 服务端在每条 face.state 里带 src_w/src_h。
 */
function drawFace(m) {
  const video = $('cam'), ov = $('overlay');
  const w = video.clientWidth || 320;
  const h = video.clientHeight || 240;
  if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
  const ctx = ov.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  const t = (m.tracks && m.tracks[0]) || null;
  const id = m.identity || null;
  const wake = m.wake || null;
  // G1 每帧 state（≈208ms 刷新一次，不是每帧都有）；state_seq 变了才是新的
  const fs = m.state || null;
  if (fs) evtCounts['face.state_seq'] = fs.state_seq;

  // 源分辨率优先用服务端下发的；缺失时退回采集分辨率
  const srcW = (t && t.src_w) || 320;
  const srcH = (t && t.src_h) || 240;
  const sx = w / srcW, sy = h / srcH;

  if (t && t.valid && t.box) {
    const [l, tp, r, b] = t.box;
    const x = l * sx, y = tp * sy;
    const bw = (r - l) * sx, bh = (b - tp) * sy;

    // 唤醒中：绿框；否则黄框
    ctx.strokeStyle = t.interacting ? '#22c55e' : '#eab308';
    ctx.lineWidth = t.interacting ? 3 : 2;
    ctx.strokeRect(x, y, bw, bh);

    // 标签：置信度 + 唇动 + 身份
    const parts = [t.score.toFixed(2)];
    if (t.speaking) parts.push('说话中');
    else parts.push(t.lip || 'SILENT');
    if (id && id.enrolled && id.name) parts.push(id.name);
    else if (id && id.uid) parts.push('未注册');
    if (t.interacting) parts.push('✓唤醒');
    const label = parts.join(' · ');

    ctx.font = '600 13px ui-monospace, monospace';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x, Math.max(0, y - 20), tw + 10, 19);
    ctx.fillStyle = t.interacting ? '#86efac' : '#fde68a';
    ctx.fillText(label, x + 5, Math.max(14, y - 6));
  }

  // 文本面板
  const fi = $('faceinfo');
  if (!t || !t.valid) {
    fi.textContent = '人脸：未检测到';
  } else {
    fi.innerHTML =
      `人脸：<b>检测到</b>  置信度 <b>${t.score.toFixed(3)}</b>  ` +
      `唇动 <b>${t.speaking ? '说话中' : (t.lip || 'SILENT')}</b>  ` +
      `唤醒 <b>${t.interacting ? '是' : '否'}</b>` +
      (wake ? `  （最近唤醒 ${wake.phase} dwell=${wake.dwell_ms}ms）` : '') +
      `<br>身份：` +
      (id
        ? (id.enrolled
            ? `<b>${id.name || '?'}</b>  uid=${id.uid}  sim=${id.similarity}`
            : `不在库（sim=${id.similarity}）`)
        : '尚未识别') +
      (fs
        ? `<br><small>state#${fs.state_seq}  ` +
          `[脸<${fs.face_present_confidence}> 唇<${fs.lip_speaking_confidence}>` +
          ` 身份<${fs.identity_confidence}>]  ` +
          `track=${fs.track_id ?? '-'}  dwell=${fs.dwell_ms}ms  ` +
          `面积=${(fs.bbox_area_ratio * 100).toFixed(1)}%  ` +
          (fs.display_name ? `称呼=${fs.display_name}` : '') +
          `</small>`
        : '');
  }
  if (t) evtCounts['face.state'] = (evtCounts['face.state'] || 0) + 1;
}

/* ---------- 统计 ---------- */
let evtCounts = {};
function refreshStats() {
  if (!session) return;
  // 每次刷新（每个音频块）都取一次设备延迟 —— outputLatency 在会话中途
  // 变化就是"D 跳变"的信号，记下来才能和 [音频会话] 日志对上时间
  trackLatencyShift();
  const s = session.stats;
  const evs = Object.entries(evtCounts)
    .map(([k, v]) => k + '=' + v).join(' ');
  statsEl.textContent =
    `会话 ${session.sessionId || '-'}  ready=${session.ready}\n` +
    `音频块 ${s.audioSent}  人脸帧 ${s.faceFramesSent}  Omni帧 ${s.omniFramesSent}\n` +
    `TTS ${s.ttsFrames} 帧 / ${(s.ttsBytes / 2 / 24000).toFixed(2)}s\n` +
    `事件: ${evs}`;
}

/* ---------- 会话 ---------- */
$('btnStart').onclick = async () => {
  try {
    $('btnStart').disabled = true;
    running = true;
    await startCapture();
    const player = new PcmPlayer(audioCtx);
    session = new OrchestratorSession({
      player,
      onEvent: (m) => {
        evtCounts[m.type] = (evtCounts[m.type] || 0) + 1;
        if (m.type === 'asr') {
          // 服务端已把增量片段拼成累积文本，这里**替换**显示即可
          $('asrline').innerHTML = '<b>ASR</b> ' +
            (m.phase === 'partial' ? '<i>' : '') + (m.text || '') +
            (m.phase === 'partial' ? '</i>' : '') + asrStateTag(m.state);
        } else if (m.type === 'tts.start') {
          // 完整显示，不截断 —— 早先限制 80 字，长回复的字幕被砍掉。
          // 用独立区域追加（ASR 的替换不会冲掉这里）。
          const log = $('ttslog');
          if (log.textContent.startsWith('（等待')) log.textContent = '';
          const d = document.createElement('div');
          d.style.marginBottom = '6px';
          d.innerHTML = '<b>播报</b> ' + (m.text || '');
          log.appendChild(d);
          log.scrollTop = log.scrollHeight;
        } else if (m.type === 'face.state') {
          drawFace(m);
        } else if (m.type === 'session.stats') {
          renderDelay(m);
        } else if (m.type === 'error') {
          log('e', 'ERROR ' + m.code + ': ' + m.message);
        } else if (m.type === 'tts.audio') {
          diag.frames += 1;
          diag.bytes += Math.floor((m.audio_base64 || '').length * 3 / 4);
          if (diag.ctxState === 'suspended') {
            // 音频被浏览器挂起了 —— 这是"有字幕没声音"的头号原因。
            // 此时**也不能承诺起播**（承诺了也播不出来），服务端会自动
            // 退回预测落位，面板上会显示"落位锚点：服务端预测"。
            diag.lastErr = 'AudioContext suspended（点一下页面任意处恢复）';
          }
          diagUpdate();
        } else {
          log('v', m.type + ' ' + JSON.stringify(m).slice(0, 100));
        }
        refreshStats();
      },
      onOpen: (m) => log('v', 'session.ready id=' + m.session_id),
      onClose: () => { log('e', '连接关闭'); running = false; },
      onError: (e) => log('e', 'WS 错误'),
    });
    const aecMode = selectedAecMode();
    await session.start({
      identity: { page: 'orchestrator-test', device_id: deviceKey() },
      aec_mode: aecMode,
      // 能力位：本前端会在 tts.start 后立刻**承诺**起播时刻，服务端据此
      // 精确落位参考轨。没有这一位的客户端会让服务端退回预测落位。
      caps: ['playback_anchor'],
    });
    log('v', `会话已建立（回声消除=${aecMode}）`);
    if (aecMode === 'service') {
      log('m', '已选算法服务 AEC —— 请外放（别戴耳机）。'
             + '「延迟」面板的「落位锚点」应显示"浏览器承诺（精确）"');
    }
    refreshStats();
  } catch (e) {
    log('e', '启动失败：' + e.message);
    $('btnStart').disabled = false;
    running = false;
  }
};

/* 音频解锁：移动浏览器（iOS 尤其）要求 AudioContext 在**用户手势**中
 * resume()，否则一直是 suspended —— 表现为"有字幕没声音"。 */
/** 跨块保持相位的 16k 重采样（采集路径）。
 *
 *  为什么不能逐块独立重采样：每块的输入长度会因 AudioWorklet 的 128 采样
 *  渲染量子而不整除，`Math.round` 出来的输出长度逐块抖动 → 长期累积漂移，
 *  而服务端的锚点映射假定"块长度之和 == 真实时长"。这里用一个**跨块保留的
 *  分数相位**把余数带到下一块。
 *
 *  ⚠️ 不做这一步的后果很严重：设备不认 16kHz 时 AudioContext 会退到
 *     44.1k/48k，而服务端 `_normalize_chunk` 会把超过 1600 采样的块
 *     **截断** —— 时间轴整体错 3 倍，锚点换算全废。（校准通道早先踩过。）
 */
const _rs16 = { phase: 0.0, srcRate: 0 };
function resampleChunk16k(x, srcRate) {
  srcRate = srcRate || 16000;
  if (!srcRate || Math.abs(srcRate - 16000) < 1) return x;
  if (_rs16.srcRate !== srcRate) { _rs16.phase = 0.0; _rs16.srcRate = srcRate; }
  const ratio = srcRate / 16000;            // 输入采样 / 输出采样
  const outN = Math.max(0, Math.floor((x.length - _rs16.phase) / ratio));
  const out = new Float32Array(outN);
  for (let i = 0; i < outN; i++) {
    const p = _rs16.phase + i * ratio;
    const i0 = Math.floor(p), i1 = Math.min(i0 + 1, x.length - 1);
    const fr = p - i0;
    out[i] = x[i0] * (1 - fr) + x[i1] * fr;
  }
  _rs16.phase = _rs16.phase + outN * ratio - x.length;   // 负数：余量留给下一块
  return out;
}

/* 切换 AEC 模式：会话中可直接切，服务端会启用/停用云端 AEC */
$('aecMode').onchange = () => {
  const m = selectedAecMode();
  log('v', `回声消除模式 → ${m}`);
  if (session && session.ready) {
    session.send({ type: 'set_aec_mode', mode: m });
    if (m === 'service') {
      log('m', '算法服务 AEC：请外放（别戴耳机）。声学延迟 D 由服务端'
             + '下发，页面「延迟」面板可看当前值与落位锚点来源');
    }
  }
};

$('btnStop').onclick = async () => {
  running = false;
  if (workletNode) { try { workletNode.port.postMessage({ command: 'stop' }); } catch (e) {} }
  if (session) await session.stop('user_stop');
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  if (audioCtx) await audioCtx.close();
  workletNode = null; session = null;
  $('btnStart').disabled = false;
  log('v', '已停止');
};

initAecMode();
log('k', `就绪。当前回声消除模式：${selectedAecMode()}`
       + `（选算法服务请外放，别戴耳机）`);

/* 启动自检：确认两个 lib 是**新版本**。
 *
 * 动机（真机踩过）：iOS Safari 没有强制刷新，改完 worklet / session 客户端
 * 后页面能拿到新 HTML，但这两个文件还走缓存 —— 表现为「客户端能力位是新的、
 * 可信里锚点却是 0 个」，服务端全程退回预测落位、回声消不掉，而页面上看不
 * 出任何异常。与其靠人记着清缓存，不如让页面自己说出来。
 */
(async () => {
  const need = [
    ['/static/duplex/lib/capture-processor.js',
     t => t.includes('t0: t0'), '采集 worklet（缺 t0 = 旧缓存）'],
    ['/static/duplex/lib/orchestrator-session.js',
     t => t.includes("'armed'"), '会话客户端（缺 armed = 旧缓存）'],
  ];
  const stale = [];
  for (const [url, ok, name] of need) {
    try {
      const t = await (await fetch(url, { cache: 'no-store' })).text();
      if (!ok(t)) stale.push(name);
    } catch (e) { /* 取不到就不下结论 */ }
  }
  if (stale.length) {
    log('e', '⚠️ 检测到**旧版脚本缓存**：' + stale.join('、')
           + ' —— 回声对齐会失效（服务端只能预测落位）');
    log('m', 'iOS Safari 清缓存：设置 → Safari → 清除历史记录与网站数据'
           + '（或在「高级 → 网站数据」里删掉本站）；'
           + '也可用无痕窗口打开本页。');
    const el = $('delayinfo');
    if (el) el.innerHTML = '<span style="color:#fca5a5"><b>⚠️ 脚本缓存过期'
      + '</b> —— 请清除本站网站数据后重新打开。'
      + '<br>现在参考轨只能按**预测**落位，回声对齐不准确。</span>';
  } else {
    log('v', '脚本自检通过（worklet / 会话客户端均为新版）');
  }
})();
</script>
</body>
</html>
