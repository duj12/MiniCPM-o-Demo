<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orchestrator 前端验证</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px/1.6 -apple-system, "Segoe UI", sans-serif; margin: 0;
         background: #111; color: #e6e6e6; }
  .wrap { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  .col { flex: 1 1 380px; min-width: 320px; }
  video { width: 100%; border-radius: 8px; background: #000; }
  /* 视频 + 人脸叠加层 */
  .stage { position: relative; line-height: 0; }
  .stage canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%;
                          border-radius: 8px; pointer-events: none; }
  button { padding: 10px 18px; font-size: 15px; border-radius: 8px;
           border: 1px solid #444; background: #2a2a2a; color: #e6e6e6;
           cursor: pointer; margin-right: 8px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.danger  { background: #b91c1c; border-color: #b91c1c; }
  .log { height: 340px; overflow-y: auto; background: #1a1a1a;
         border: 1px solid #333; border-radius: 8px; padding: 10px;
         font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .log div { margin-bottom: 3px; word-break: break-all; }
  .k { color: #7dd3fc; }  .v { color: #86efac; }  .e { color: #fca5a5; }
  .m { color: #fcd34d; }
  .stats { font-family: ui-monospace, monospace; font-size: 12px;
           background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
           padding: 10px; margin-top: 10px; }
  /* 字幕区：长回复要能完整显示并可滚动（早先限高+截断，长回复看不全） */
  .sub { margin-top: 10px; min-height: 60px; max-height: 300px;
         overflow-y: auto; background: #1a1a1a;
         border: 1px solid #333; border-radius: 8px; padding: 10px;
         line-height: 1.6; word-break: break-word; }
  h3 { margin: 0 0 8px; font-size: 14px; color: #aaa; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <h3>摄像头（人脸框叠加）</h3>
    <div class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <canvas id="cv" style="display:none"></canvas>
    <div class="stats" id="faceinfo">人脸：等待中…</div>
    <div style="margin-top:12px">
      <label style="display:block;margin-bottom:8px">
        回声消除：
        <select id="aecMode">
          <option value="browser">浏览器原生 AEC（推荐，不受网络延迟影响）</option>
          <option value="service">算法服务 AEC（需先校准延迟）</option>
          <option value="off">不做回声消除</option>
        </select>
      </label>
      <button id="btnStart" class="primary">开始会话</button>
      <button id="btnUnlock">🔊 解锁音频</button>
      <button id="btnCalib">⏱ 校准延迟</button>
      <button id="btnStop" class="danger">停止</button>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#888">
      「校准延迟」不需要先开始会话：点一下 → 授权麦克风 → 播放 1.5 秒校准音
      → 自动算出声学延迟并保存。<b>请外放，不要戴耳机</b>（耳机没有回声路径）。
    </div>
    <div class="stats" id="delayinfo">延迟：未测量</div>
    <div class="stats" id="audiostat">音频：未开始</div>
    <div class="stats" id="stats">未开始</div>
  </div>
  <div class="col">
    <h3>字幕 / 事件</h3>
    <!-- ASR 与 TTS 分两个区域：ASR 是**替换**语义（流式刷新同一行），
         TTS 是**追加**语义（多轮累积）。早先共用一个元素，ASR 的替换
         会把播报记录冲掉。 -->
    <div class="sub" id="subtitle">
      <div id="asrline">（等待 ASR 输出）</div>
    </div>
    <h3 style="margin-top:10px">播报记录</h3>
    <div class="sub" id="ttslog">（等待播报）</div>
    <h3 style="margin-top:14px">事件日志</h3>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="/static/duplex/lib/orchestrator-session.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log'), statsEl = $('stats');
let session = null, micStream = null, audioCtx = null, workletNode = null;
let videoStream = null, running = false, frameCounter = 0;

function log(cls, msg) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild);
}

/* ---------- 播放器：PCM16 24kHz → WebAudio，并暴露 ctx 时间供回执 ---------- */
/* 播放诊断：把每一步的可疑点暴露到页面上。
 * 远程调试时看不到控制台，必须让状态可见。 */
const diag = {
  ctxState: '-', ctxRate: '-', frames: 0, bytes: 0,
  scheduled: 0, startedAt: '-', lastErr: '-', peak: 0,
};
function diagUpdate() {
  const el = $('audiostat');
  if (!el) return;
  el.innerHTML =
    `AudioContext: <b>${diag.ctxState}</b> @${diag.ctxRate}Hz　` +
    `TTS 帧 <b>${diag.frames}</b> / ${(diag.bytes/2/24000).toFixed(2)}s　` +
    `已调度 <b>${diag.scheduled}</b>　峰值 ${diag.peak.toFixed(3)}<br>` +
    (diag.startedAt !== '-' ? `起播时刻 ${diag.startedAt}<br>` : '') +
    (diag.lastErr !== '-' ? `<span style="color:#fca5a5">错误: ${diag.lastErr}</span>` : '');
}

class PcmPlayer {
  constructor(ctx) {
    this.ctx = ctx;
    this.nextAt = 0;
    this.responseId = null;
    this.srcRate = 24000;       // 服务端 TTS 输出采样率
    this.gain = ctx.createGain();
    this.gain.gain.value = 1.0;
    this.gain.connect(ctx.destination);
    // 保活节点：某些移动浏览器在没有持续音源时会挂起 context
    this._keep = ctx.createConstantSource
      ? ctx.createConstantSource() : null;
    if (this._keep) {
      this._keep.offset.value = 0;
      this._keep.connect(ctx.destination);
      this._keep.start();
    }
  }
  now() { return this.ctx.currentTime; }
  beginResponse(id, sr) {
    this.responseId = id;
    this.srcRate = sr || 24000;
    // 起播留 200ms 提前量（与云端 config 的 playback_delay_ms 一致）
    this.nextAt = Math.max(this.nextAt, this.ctx.currentTime + 0.2);
  }
  /** 播放一段 int16 base64 PCM。
   *  **手动重采样到 AudioContext 的实际采样率** —— 不用 createBuffer 的
   *  异采样率路径。部分移动浏览器（尤其 Safari 旧版）在 buffer 采样率与
   *  context 不一致时行为不可靠，会静默无声。 */
  playBase64(b64, sr) {
    const bin = atob(b64);
    const n = bin.length >> 1;
    const i16 = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      i16[i] = (bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8)) << 16 >> 16;
    }
    const srcRate = sr || this.srcRate;
    const ctxRate = this.ctx.sampleRate;
    // int16 → float32 + 峰值统计（诊断用：能区分"没送到"与"送到了但没响"）
    let peak = 0;
    const f32src = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const v = i16[i] / 32768;
      f32src[i] = v;
      const a = Math.abs(v);
      if (a > peak) peak = a;
    }
    diag.peak = Math.max(diag.peak, peak);

    // 线性重采样到 context 采样率
    let f32 = f32src, rate = srcRate;
    if (ctxRate && Math.abs(ctxRate - srcRate) > 1) {
      const outN = Math.max(1, Math.round(n * ctxRate / srcRate));
      f32 = new Float32Array(outN);
      const ratio = n / outN;
      for (let i = 0; i < outN; i++) {
        const p = i * ratio;
        const i0 = Math.floor(p), i1 = Math.min(i0 + 1, n - 1);
        const fr = p - i0;
        f32[i] = f32src[i0] * (1 - fr) + f32src[i1] * fr;
      }
      rate = ctxRate;
    }

    const buf = this.ctx.createBuffer(1, f32.length, rate);
    buf.copyToChannel(f32, 0);
    const node = this.ctx.createBufferSource();
    node.buffer = buf;
    node.connect(this.gain);
    const at = Math.max(this.nextAt, this.ctx.currentTime + 0.02);
    node.start(at);
    this.nextAt = at + buf.duration;
    diag.scheduled += 1;
    if (diag.startedAt === '-') {
      diag.startedAt = `+${(at - this.ctx.currentTime).toFixed(2)}s`;
    }
    diagUpdate();
  }
  endResponse() { /* 队列自然播完 */ }
  stop() {
    try { this.gain.gain.value = 0; this.gain.gain.value = 1; } catch (e) {}
    this.nextAt = this.ctx.currentTime + 0.05;
  }
}

/* ---------- AEC 模式 / 延迟显示 ---------- */
function selectedAecMode() {
  const el = $('aecMode');
  return el ? el.value : 'browser';
}

/** 设备标识：用于让服务端记住这台设备的延迟（下次冷启动即准）。 */
function deviceKey() {
  let k = localStorage.getItem('orch_device_key');
  if (!k) {
    k = 'dev_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('orch_device_key', k);
  }
  return k;
}

/** 显示服务端推来的链路状态（重点是声学延迟）。 */
let lastStats = null;
function renderDelay(s) {
  lastStats = s;
  const el = $('delayinfo');
  if (!el) return;
  const modeName = { browser: '浏览器原生', service: '算法服务', off: '关闭' };
  const srcName = { stored: '历史记录', default: '默认值',
                    measured: '自适应测量', calibrated: '校准值',
                    client: '前端上报' };
  let html =
    `回声消除：<b>${modeName[s.aec_mode] || s.aec_mode}</b>　` +
    `声学延迟：<b>${s.delay_ms.toFixed(0)} ms</b> ` +
    `（${srcName[s.delay_source] || s.delay_source}）`;
  if (s.aec_mode === 'service') {
    html += `<br>推荐设置：<b>${s.suggested_delay_ms.toFixed(0)} ms</b>`;
    if (!s.delay_measured) {
      html += `　<span style="color:#fcd34d">← 尚未测量，建议点「校准延迟」</span>`;
    } else if (s.delay_ms > 400) {
      html += `　<span style="color:#fca5a5">延迟偏高，云端 AEC 抑制效果会明显下降</span>`;
    }
  }
  if (s.aec_active) {
    html += `<br>云端 AEC：工作中，farend 非零占比 ${(s.ref_nonzero_ratio*100).toFixed(0)}%`;
    if (s.erle_db != null) {
      // 每轮播报独立测量（近端也计入，故绝对值偏低；看**变化**）
      const good = s.erle_db >= 8;
      html += `　本轮 ERLE：<b style="color:${good ? '#86efac' : '#fca5a5'}">` +
              `${s.erle_db.toFixed(1)} dB</b>`;
      if (!good) {
        html += `　<span style="color:#fcd34d">← 抑制偏弱，可试其他 D 值</span>`;
      }
    }
  }
  el.innerHTML = html;
}

/* ---------- 采集 ---------- */
async function startCapture() {
  // 回声消除模式由用户在页面上选（见 #aecMode）——**二选一，不能同时开**：
  //   browser —— 浏览器原生 AEC（设备侧工作，不受网络延迟影响）
  //   service —— 云端算法 AEC（需要参考轨按声学延迟 D 预对齐）
  //   off     —— 都不做（调试）
  //
  // ⚠️ 选 service 时**必须关掉浏览器 AEC**：否则回声在设备侧就被消掉了，
  //    送到云端时已经没有回声，算法 AEC 无从下手 —— 这时"测试云端效果"
  //    实际上是浏览器在做功，结论完全失真。
  //    （AGC 保持开启：它只影响增益，不破坏回声路径的线性性。）
  const mode = selectedAecMode();
  const useBrowserAEC = (mode === 'browser');
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: useBrowserAEC,
             noiseSuppression: useBrowserAEC, autoGainControl: true },
    video: false,
  });
  log('k', `麦克风约束：echoCancellation=${useBrowserAEC} `
         + `noiseSuppression=${useBrowserAEC}（模式=${mode}）`);
  videoStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  $('cam').srcObject = videoStream;

  // ⚠️ 采集与播放共用一个 AudioContext（16kHz）。某些移动浏览器不支持
  // 16kHz 的 AudioContext，会退到设备默认率 —— 这没关系，播放器会手动
  // 重采样到 ctx.sampleRate。但如果 context 一直是 suspended（iOS 需要
  // 用户手势），就会「有字幕没声音」。
  audioCtx = new AudioContext({ sampleRate: 16000 });
  diag.ctxState = audioCtx.state;
  diag.ctxRate = audioCtx.sampleRate;
  diagUpdate();
  audioCtx.addEventListener?.('statechange', () => {
    diag.ctxState = audioCtx.state;
    diagUpdate();
    if (audioCtx.state === 'suspended') {
      log('e', 'AudioContext 被挂起 —— 点「解锁音频」恢复');
    }
  });
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  diag.ctxState = audioCtx.state;
  diag.ctxRate = audioCtx.sampleRate;
  diagUpdate();
  await audioCtx.audioWorklet.addModule('/static/duplex/lib/capture-processor.js');

  const src = audioCtx.createMediaStreamSource(micStream);
  const chunkSize = Math.max(160, Math.floor(audioCtx.sampleRate / 10)); // 100ms
  workletNode = new AudioWorkletNode(audioCtx, 'capture-processor',
                                     { processorOptions: { chunkSize } });
  const sink = audioCtx.createGain(); sink.gain.value = 0;
  src.connect(workletNode); workletNode.connect(sink); sink.connect(audioCtx.destination);
  log('k', '采集启动：chunkSize=' + chunkSize + ' (' +
      (chunkSize / audioCtx.sampleRate * 1000).toFixed(0) + 'ms)');

  const cv = $('cv'), ctx2d = cv.getContext('2d'), video = $('cam');

  function grab(maxW, maxH, q) {
    if (!video.videoWidth) return null;
    const vw = video.videoWidth, vh = video.videoHeight;
    const s = Math.min(1, maxW / vw, maxH / vh);
    cv.width = Math.round(vw * s); cv.height = Math.round(vh * s);
    ctx2d.drawImage(video, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', q).split(',')[1] || null;
  }

  workletNode.port.onmessage = (ev) => {
    if (!running || ev.data.type !== 'chunk') return;
    frameCounter = (frameCounter + 1) % 10;   // 10 块 = 1s
    session && session.sendChunk({
      audio: ev.data.audio,
      frameBase64: grab(320, 240, 0.5),                    // 人脸 25fps
      frameOmniBase64: frameCounter === 0 ? grab(1280, 720, 0.7) : null, // Omni 1fps
    });
  };
  workletNode.port.postMessage({ command: 'start' });
}

/* ---------- 人脸叠加绘制 ----------
 * ⚠️ 框坐标基于**服务端实际收到的帧尺寸**，必须用它做映射。
 * 曾写死 640×480，而实际喂的是 320×240 —— 位置与尺寸都变成一半，
 * 表现为"框在左上角且比脸小很多"。
 * 服务端在每条 face.state 里带 src_w/src_h。
 */
function drawFace(m) {
  const video = $('cam'), ov = $('overlay');
  const w = video.clientWidth || 320;
  const h = video.clientHeight || 240;
  if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
  const ctx = ov.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  const t = (m.tracks && m.tracks[0]) || null;
  const id = m.identity || null;
  const wake = m.wake || null;

  // 源分辨率优先用服务端下发的；缺失时退回采集分辨率
  const srcW = (t && t.src_w) || 320;
  const srcH = (t && t.src_h) || 240;
  const sx = w / srcW, sy = h / srcH;

  if (t && t.valid && t.box) {
    const [l, tp, r, b] = t.box;
    const x = l * sx, y = tp * sy;
    const bw = (r - l) * sx, bh = (b - tp) * sy;

    // 唤醒中：绿框；否则黄框
    ctx.strokeStyle = t.interacting ? '#22c55e' : '#eab308';
    ctx.lineWidth = t.interacting ? 3 : 2;
    ctx.strokeRect(x, y, bw, bh);

    // 标签：置信度 + 唇动 + 身份
    const parts = [t.score.toFixed(2)];
    if (t.speaking) parts.push('说话中');
    else parts.push(t.lip || 'SILENT');
    if (id && id.enrolled && id.name) parts.push(id.name);
    else if (id && id.uid) parts.push('未注册');
    if (t.interacting) parts.push('✓唤醒');
    const label = parts.join(' · ');

    ctx.font = '600 13px ui-monospace, monospace';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x, Math.max(0, y - 20), tw + 10, 19);
    ctx.fillStyle = t.interacting ? '#86efac' : '#fde68a';
    ctx.fillText(label, x + 5, Math.max(14, y - 6));
  }

  // 文本面板
  const fi = $('faceinfo');
  if (!t || !t.valid) {
    fi.textContent = '人脸：未检测到';
  } else {
    fi.innerHTML =
      `人脸：<b>检测到</b>  置信度 <b>${t.score.toFixed(3)}</b>  ` +
      `唇动 <b>${t.speaking ? '说话中' : (t.lip || 'SILENT')}</b>  ` +
      `唤醒 <b>${t.interacting ? '是' : '否'}</b>` +
      (wake ? `  （最近唤醒 ${wake.phase} dwell=${wake.dwell_ms}ms）` : '') +
      `<br>身份：` +
      (id
        ? (id.enrolled
            ? `<b>${id.name || '?'}</b>  uid=${id.uid}  sim=${id.similarity}`
            : `不在库（sim=${id.similarity}）`)
        : '尚未识别');
  }
  if (t) evtCounts['face.state'] = (evtCounts['face.state'] || 0) + 1;
}

/* ---------- 统计 ---------- */
let evtCounts = {};
function refreshStats() {
  if (!session) return;
  const s = session.stats;
  const evs = Object.entries(evtCounts)
    .map(([k, v]) => k + '=' + v).join(' ');
  statsEl.textContent =
    `会话 ${session.sessionId || '-'}  ready=${session.ready}\n` +
    `音频块 ${s.audioSent}  人脸帧 ${s.faceFramesSent}  Omni帧 ${s.omniFramesSent}\n` +
    `TTS ${s.ttsFrames} 帧 / ${(s.ttsBytes / 2 / 24000).toFixed(2)}s\n` +
    `事件: ${evs}`;
}

/* ---------- 会话 ---------- */
$('btnStart').onclick = async () => {
  try {
    $('btnStart').disabled = true;
    running = true;
    await startCapture();
    const player = new PcmPlayer(audioCtx);
    session = new OrchestratorSession({
      player,
      onEvent: (m) => {
        evtCounts[m.type] = (evtCounts[m.type] || 0) + 1;
        if (m.type === 'asr') {
          // 服务端已把增量片段拼成累积文本，这里**替换**显示即可
          $('asrline').innerHTML = '<b>ASR</b> ' +
            (m.phase === 'partial' ? '<i>' : '') + (m.text || '') +
            (m.phase === 'partial' ? '</i>' : '');
        } else if (m.type === 'tts.start') {
          // 完整显示，不截断 —— 早先限制 80 字，长回复的字幕被砍掉。
          // 用独立区域追加（ASR 的替换不会冲掉这里）。
          const log = $('ttslog');
          if (log.textContent.startsWith('（等待')) log.textContent = '';
          const d = document.createElement('div');
          d.style.marginBottom = '6px';
          d.innerHTML = '<b>播报</b> ' + (m.text || '');
          log.appendChild(d);
          log.scrollTop = log.scrollHeight;
        } else if (m.type === 'face.state') {
          drawFace(m);
        } else if (m.type === 'session.stats') {
          renderDelay(m);
        } else if (m.type === 'error') {
          log('e', 'ERROR ' + m.code + ': ' + m.message);
        } else if (m.type === 'tts.audio') {
          diag.frames += 1;
          diag.bytes += Math.floor((m.audio_base64 || '').length * 3 / 4);
          if (diag.ctxState === 'suspended') {
            // 音频被浏览器挂起了 —— 这是"有字幕没声音"的头号原因
            diag.lastErr = 'AudioContext suspended（点「解锁音频」）';
          }
          diagUpdate();
        } else {
          log('v', m.type + ' ' + JSON.stringify(m).slice(0, 100));
        }
        refreshStats();
      },
      onOpen: (m) => log('v', 'session.ready id=' + m.session_id),
      onClose: () => { log('e', '连接关闭'); running = false; },
      onError: (e) => log('e', 'WS 错误'),
    });
    const aecMode = selectedAecMode();
    await session.start({
      identity: { page: 'orchestrator-test', device_id: deviceKey() },
      aec_mode: aecMode,
    });
    log('v', `会话已建立（回声消除=${aecMode}）`);
    if (aecMode === 'service') {
      log('m', '已选算法服务 AEC —— 建议先点「校准延迟」，否则第一句播报消得不准');
    }
    log('v', '会话已建立');
    refreshStats();
  } catch (e) {
    log('e', '启动失败：' + e.message);
    $('btnStart').disabled = false;
    running = false;
  }
};

/* 音频解锁：移动浏览器（iOS 尤其）要求 AudioContext 在**用户手势**中
 * resume()，否则一直是 suspended —— 表现为"有字幕没声音"。 */
$('btnUnlock').onclick = async () => {
  if (!audioCtx) { log('e', '请先点「开始会话」'); return; }
  try {
    if (audioCtx.state !== 'running') await audioCtx.resume();
    diag.ctxState = audioCtx.state;
    diag.ctxRate = audioCtx.sampleRate;
    diagUpdate();
    log('v', `音频已解锁：state=${audioCtx.state} rate=${audioCtx.sampleRate}`);
    // 播一个短促提示音，确认真的出声
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    g.gain.value = 0.08;
    o.frequency.value = 880;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.25);
    log('v', '已播放 880Hz 提示音（0.25s）—— 应能听到');
  } catch (e) {
    log('e', '解锁失败：' + e.message);
  }
};

/* 延迟校准 —— **独立于会话**。
 *
 * 不需要"开始会话"：校准只要"播一段已知音频 → 收麦克风 → 算互相关"，
 * 与 ASR/OmniLLM/TTS 无关。走独立 WS 通道 /v1/calibrate，约 3 秒完成。
 *
 * 关键：校准期间**必须关闭浏览器 AEC**（否则回声在设备侧被消掉，
 * 测到的"延迟"是错的），且必须**外放**（戴耳机没有回声路径）。 */
$('btnCalib').onclick = async () => {
  const btn = $('btnCalib');
  btn.disabled = true;
  let ws = null, mic = null, ctx = null, worklet = null;
  try {
    // 1) 麦克风：**关掉 AEC/NS**，只要原始信号（才含真实回声）
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false,
               noiseSuppression: false, autoGainControl: false },
      video: false,
    });
    ctx = new AudioContext({ sampleRate: 16000 });
    if (ctx.state === 'suspended') await ctx.resume();

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/v1/calibrate`);
    await new Promise((res, rej) => {
      ws.onopen = res;
      ws.onerror = () => rej(new Error('无法连接校准通道'));
    });

    const result = await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('校准超时')), 20000);
      let playing = false, player = null;

      ws.onmessage = async (ev) => {
        const m = JSON.parse(ev.data);
        if (m.type === 'calibrate.play') {
          log('v', `收到校准音频 ${m.duration_s.toFixed(1)}s —— 正在播放，`
                 + `请保持安静（外放，别戴耳机）`);
          // 2) 播放：用与 TTS 相同的 WebAudio 路径
          const bin = atob(m.audio_base64);
          const n = bin.length >> 1;
          const i16 = new Int16Array(n);
          for (let i = 0; i < n; i++) {
            i16[i] = (bin.charCodeAt(i*2) | (bin.charCodeAt(i*2+1) << 8)) << 16 >> 16;
          }
          const f32 = new Float32Array(n);
          for (let i = 0; i < n; i++) f32[i] = i16[i] / 32768;
          // 重采样到 ctx 采样率
          const outN = Math.max(1, Math.round(n * ctx.sampleRate / m.sample_rate));
          const out = new Float32Array(outN);
          const ratio = n / outN;
          for (let i = 0; i < outN; i++) {
            const p = i * ratio, i0 = Math.floor(p),
                  i1 = Math.min(i0+1, n-1), fr = p - i0;
            out[i] = f32[i0]*(1-fr) + f32[i1]*fr;
          }
          const buf = ctx.createBuffer(1, outN, ctx.sampleRate);
          buf.copyToChannel(out, 0);
          const src = ctx.createBufferSource();
          src.buffer = buf; src.connect(ctx.destination);
          src.start();
          playing = true;

          // 3) 采集：从播放**之前**就开始录，覆盖整个回声路径
          await ctx.audioWorklet.addModule('/static/duplex/lib/capture-processor.js');
          const ms = ctx.createMediaStreamSource(mic);
          worklet = new AudioWorkletNode(ctx, 'capture-processor',
                                         { processorOptions: { chunkSize: 1600 } });
          const sink = ctx.createGain(); sink.gain.value = 0;
          ms.connect(worklet); worklet.connect(sink); sink.connect(ctx.destination);
          worklet.port.onmessage = (e) => {
            if (e.data.type !== 'chunk' || !playing) return;
            if (ws.readyState !== WebSocket.OPEN) return;
            const a = e.data.audio;
            const ab = new ArrayBuffer(a.length * 4);
            new Float32Array(ab).set(a);
            ws.send(JSON.stringify({
              type: 'calibrate.mic',
              audio_base64: b64FromBuffer(ab),
            }));
          };
          worklet.port.postMessage({ command: 'start' });
          // 播放结束后再多收 1.5s（覆盖最大搜索延迟）
          setTimeout(() => { playing = false; }, (m.duration_s + 1.2) * 1000);

        } else if (m.type === 'calibrate.done' || 'ok' in m) {
          clearTimeout(timeout);
          resolve(m);
        }
      };
    });

    if (result.ok) {
      log('v', `✓ 校准完成：声学延迟 ${result.delay_ms.toFixed(0)} ms`
             + `（已保存，下次自动使用）`);
      $('delayInput').value = Math.round(result.delay_ms);
    } else {
      log('e', '校准失败：' + (result.error || '未知原因'));
    }
  } catch (e) {
    log('e', '校准失败：' + e.message);
  } finally {
    try { worklet && worklet.port.postMessage({ command: 'stop' }); } catch (x) {}
    try { ws && ws.close(); } catch (x) {}
    try { mic && mic.getTracks().forEach(t => t.stop()); } catch (x) {}
    try { ctx && await ctx.close(); } catch (x) {}
    btn.disabled = false;
  }
};

/** ArrayBuffer → base64（校准通道用） */
function b64FromBuffer(buffer) {
  const bytes = new Uint8Array(buffer);
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(s);
}

/* 切换 AEC 模式：会话中可直接切，服务端会启用/停用云端 AEC */
$('aecMode').onchange = () => {
  const m = selectedAecMode();
  log('v', `回声消除模式 → ${m}`);
  if (session && session.ready) {
    session.send({ type: 'set_aec_mode', mode: m });
    if (m === 'service') {
      log('m', '算法服务 AEC 需要延迟校准 —— 建议点「校准延迟」');
    }
  }
};

$('btnStop').onclick = async () => {
  running = false;
  if (workletNode) { try { workletNode.port.postMessage({ command: 'stop' }); } catch (e) {} }
  if (session) await session.stop('user_stop');
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  if (audioCtx) await audioCtx.close();
  workletNode = null; session = null;
  $('btnStart').disabled = false;
  log('v', '已停止');
};

log('k', '就绪。点「开始会话」授权摄像头与麦克风。');
</script>
</body>
</html>
