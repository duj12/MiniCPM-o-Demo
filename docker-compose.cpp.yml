# MiniCPM-o C++ backend deployment (docker compose)
#
# Topology:
#   gateway            x1   host :${GATEWAY_HOST_PORT:-8006} -> container :8006
#   cpp-worker-backend x1   one container with:
#       - llama-omni-server (MiniCPM-o) or llama-qwen3omni-server (Qwen3-Omni)
#         backend on 127.0.0.1:22500
#       - Python worker on 0.0.0.0:22400, forwarding to the local backend
#
# Model directory layout (default ./checkpoints, overridable via MODEL_HOST_PATH):
#   MODEL_HOST_PATH/
#     qwen3omni-gguf/                # Qwen3-Omni (ACTIVE_MODEL=qwen3omni)
#       Qwen3-Omni-30B-A3B-Instruct-Q4_K_S.gguf
#       mmproj-Qwen3-Omni-30B-A3B-Instruct-Q8_0.gguf
#     MiniCPM-o-4_5-gguf/            # MiniCPM-o-4.5 (ACTIVE_MODEL=minicpm)
#       MiniCPM-o-4_5-Q4_K_M.gguf
#       vision/ audio/ tts/ token2wav-gguf/
#     fsmn-vad-onnx/                 # FSMN-VAD (model_quant.onnx)
#     TurnSense/                     # TurnSense (pretrained_models/v1.0/model_int8.onnx)
#
# Usage:
#   mkdir -p certs data
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/key.pem -out certs/cert.pem -subj "/CN=minicpm-o"
#   MODEL_HOST_PATH=./checkpoints \   # 默认即 ./checkpoints，可省略
#   GATEWAY_HOST_PORT=8006 \
#   CPP_GPU_ID=0 \
#   docker compose -f docker-compose.cpp.yml up -d --build

services:
  cpp-worker-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpp-worker-backend
      args:
        LLAMA_OMNI_REPO: ${LLAMA_OMNI_REPO:-https://github.com/duj12/llama.cpp-omni.git}
        LLAMA_OMNI_REFSPEC: ${LLAMA_OMNI_REFSPEC:-dev}
        LLAMA_OMNI_REF: ${LLAMA_OMNI_REF:-origin/dev}
    image: omnillm-cpp-backend:dev
    container_name: minicpm-o-demo-cpp-worker-1
    environment:
      ACTIVE_MODEL: "${ACTIVE_MODEL:-minicpm}"
      GPU_ID: "0"
      BACKEND_PORT: "22500"
      WORKER_PORT: "22400"
      LLAMA_SERVER_EXTRA_ARGS: "${LLAMA_SERVER_EXTRA_ARGS:--c 16384 --parallel 4}"
      GGML_CUDA_DISABLE_GRAPHS: "1"
      # VAD + TurnSense 半双工参数（worker 读 env 作默认值，请求 config 可覆盖）
      VAD_TAIL_SIL: "${VAD_TAIL_SIL:-600}"
      VAD_MAX_LEN: "${VAD_MAX_LEN:-60000}"
      VAD_CHUNK_SIZE: "${VAD_CHUNK_SIZE:-1000}"
      TS_INCOMPLETE_WAIT_MS: "${TS_INCOMPLETE_WAIT_MS:-900}"
      TS_INVALID_THRESHOLD: "${TS_INVALID_THRESHOLD:-0.9}"
    volumes:
      # 统一模型目录：项目内 checkpoints/（含 qwen3omni-gguf/、fsmn-vad-onnx/、TurnSense/）
      # 默认挂 ./checkpoints，可用 MODEL_HOST_PATH 覆盖为别处（如 SVN 下载目录）。
      #   <MODEL_HOST_PATH>/
      #     qwen3omni-gguf/    (for ACTIVE_MODEL=qwen3omni)
      #     MiniCPM-o-4_5-gguf/(for ACTIVE_MODEL=minicpm)
      #     fsmn-vad-onnx/     (VAD, model_quant.onnx)
      #     TurnSense/         (pretrained_models/v1.0/model_int8.onnx)
      - ${MODEL_HOST_PATH:-./checkpoints}:/models:ro
      # TurnSense 模型独立挂载（默认 MODEL_HOST_PATH/TurnSense，可覆盖为别处）。
      # 注意：/models 挂为 ro，其下不能建 /models/TurnSense 子挂载点（read-only fs）。
      # 因此 TurnSense 挂到独立 /turnsense，half_duplex 探测候选含 /turnsense。
      - ${TURNSENSE_HOST_PATH:-${MODEL_HOST_PATH:-./checkpoints}/TurnSense}:/turnsense:ro
      # 预设（presets）挂载，宿主机改动即时生效，避免镜像内残留旧品牌文案。
      - ./assets/presets:/app/assets/presets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # GPU 绑定由 .env 的 CPP_GPU_ID 控制（逗号分隔，如 0,1 = 双卡张量并行）。
              # docker NVIDIA runtime 会把它解析为多张 GPU；单卡设 CPP_GPU_ID=0。
              device_ids: [ "${CPP_GPU_ID:-0}" ]
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1:22400/health" ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: omnillm-gateway:dev
    environment:
      # 与 cpp-worker-backend 保持一致，让 gateway 的 /api/frontend_defaults
      # 能正确报告当前后端模型（config.py 里优先读 ACTIVE_MODEL 环境变量）。
      ACTIVE_MODEL: "${ACTIVE_MODEL:-minicpm}"
      # 前端 Slots 上限（每 worker 最大并发 session），与 C++ --parallel 匹配。
      WORKER_MAX_CONCURRENCY: "${WORKER_MAX_CONCURRENCY:-4}"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8006"
      - "--https"
      - "--ssl-certfile"
      - "/app/certs/cert.pem"
      - "--ssl-keyfile"
      - "/app/certs/key.pem"
      - "--workers"
      - "cpp-worker-backend:22400"
    ports:
      - "${GATEWAY_HOST_PORT:-8006}:8006"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${CERTS_HOST_PATH:-./certs}:/app/certs:ro
      # 开发期挂载 config.py + 改动的静态前端文件，宿主机改动即时生效，
      # 无需重建镜像。不整体挂载 static/（会盖掉镜像内 bun 构建的 mobile/docs）。
      # gateway.py 也挂载：旧镜像内 gateway.py 不含 WORKER_MAX_CONCURRENCY
      # 的 env 读取逻辑，前端并发显示会落到默认 4；挂载宿主机新版即时修复。
      - ./gateway.py:/app/gateway.py:ro
      - ./config.py:/app/config.py:ro
      - ./static/omni/omni.html:/app/static/omni/omni.html:ro
      - ./static/omni/omni-app.js:/app/static/omni/omni-app.js:ro
      - ./static/audio-duplex/audio_duplex.html:/app/static/audio-duplex/audio_duplex.html:ro
      - ./static/audio-duplex/audio-duplex-app.js:/app/static/audio-duplex/audio-duplex-app.js:ro
      - ./static/realtime/realtime-app.js:/app/static/realtime/realtime-app.js:ro
      - ./static/half-duplex/half_duplex.html:/app/static/half-duplex/half_duplex.html:ro
      - ./static/half-duplex/half-duplex-app.js:/app/static/half-duplex/half-duplex-app.js:ro
      - ./static/mobile-omni/index.html:/app/static/mobile-omni/index.html:ro
      - ./static/duplex/ui/duplex-ui.js:/app/static/duplex/ui/duplex-ui.js:ro
      - ./static/index.html:/app/static/index.html:ro
      - ./static/admin.html:/app/static/admin.html:ro
      - ./static/session-viewer.html:/app/static/session-viewer.html:ro
      - ./static/mobile-flow-mock.html:/app/static/mobile-flow-mock.html:ro
      - ./static/turnbased.html:/app/static/turnbased.html:ro
      - ./static/prototype-content-editor.html:/app/static/prototype-content-editor.html:ro
      - ./static/realtime/realtime.html:/app/static/realtime/realtime.html:ro
      - ./static/faq:/app/static/faq:ro
      # 预设（presets）挂载，宿主机改动即时生效，避免镜像内残留旧品牌文案。
      - ./assets/presets:/app/assets/presets:ro
      # React 移动端构建产物（/mobile 页面），宿主机构建后即时生效。
      - ./static/mobile:/app/static/mobile:ro
    depends_on:
      cpp-worker-backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
