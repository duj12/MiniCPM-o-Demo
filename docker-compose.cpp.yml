# MiniCPM-o C++ backend deployment (docker compose)
#
# Topology:
#   gateway            x1   host :${GATEWAY_HOST_PORT:-8006} -> container :8006
#   cpp-worker-backend x1   one container with:
#       - llama-omni-server (MiniCPM-o) or llama-qwen3omni-server (Qwen3-Omni)
#         backend on 127.0.0.1:22500
#       - Python worker on 0.0.0.0:22400, forwarding to the local backend
#
# Model directory layout:
#   GGUF_MODEL_HOST_PATH/
#     MiniCPM-o-4_5-gguf/           # MiniCPM-o-4.5 (default)
#       MiniCPM-o-4_5-Q4_K_M.gguf
#       vision/
#       audio/
#       tts/
#       token2wav-gguf/
#     qwen3omni-gguf/                # Qwen3-Omni (ACTIVE_MODEL=qwen3omni)
#       Qwen3-Omni-30B-A3B-Instruct-Q4_K_S.gguf
#       mmproj-Qwen3-Omni-30B-A3B-Instruct-Q8_0.gguf
#
# Usage:
#   mkdir -p certs data
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/key.pem -out certs/cert.pem -subj "/CN=minicpm-o"
#   GGUF_MODEL_HOST_PATH=/path/to/models_dir \
#   GATEWAY_HOST_PORT=8006 \
#   CPP_GPU_ID=0 \
#   docker compose -f docker-compose.cpp.yml up -d --build

services:
  cpp-worker-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpp-worker-backend
      args:
        LLAMA_OMNI_REFSPEC: ${LLAMA_OMNI_REFSPEC:-master}
        LLAMA_OMNI_REF: ${LLAMA_OMNI_REF:-origin/master}
    image: minicpm-cpp-worker-backend:dev
    container_name: minicpm-o-demo-cpp-worker-1
    environment:
      ACTIVE_MODEL: "${ACTIVE_MODEL:-minicpm}"
      GPU_ID: "0"
      BACKEND_PORT: "22500"
      WORKER_PORT: "22400"
      LLAMA_SERVER_EXTRA_ARGS: "${LLAMA_SERVER_EXTRA_ARGS:--c 16384 --parallel 4}"
      GGML_CUDA_DISABLE_GRAPHS: "1"
    volumes:
      # Mount the parent directory containing both MiniCPM and Qwen3-Omni model dirs.
      # Expected layout on host:
      #   <GGUF_MODEL_HOST_PATH>/
      #     MiniCPM-o-4_5-gguf/    (for ACTIVE_MODEL=minicpm)
      #     qwen3omni-gguf/        (for ACTIVE_MODEL=qwen3omni)
      - ${GGUF_MODEL_HOST_PATH:?set GGUF_MODEL_HOST_PATH (parent of MiniCPM-o-4_5-gguf/ and qwen3omni-gguf/)}:/models:ro
      # TurnSense (semantic completeness judge for VAD+TurnSense turn decision):
      #   - python modules: turnsense_module.py / turnsense_config.py / audio_frontend.py
      #   - model weights:  checkpoints/TurnSense/pretrained_models/v1.0/model_fp32.onnx
      # Mounted so runtime/half_duplex.py's auto-detect finds both the module
      # (sys.path /Fun-ASR-deploy) and the model (v1.0/v1.1).
      - ${FUNASR_DEPLOY_HOST_PATH:-../Fun-ASR-deploy}:/Fun-ASR-deploy:ro
      # FSMN-VAD onnx 模型（VAD+TurnSense 用）：
      #   model.onnx + config.yaml + am.mvn，挂载到 half_duplex.py 的候选路径
      #   <root>/vad-runtime/model（root_for_deploy() 在容器内解析为 /）。
      - ${VAD_RUNTIME_MODEL_HOST_PATH:-../vad-runtime/model}:/vad-runtime/model:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "${CPP_GPU_ID:-0}" ]
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1:22400/health" ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: minicpm-gateway:dev
    environment:
      # 与 cpp-worker-backend 保持一致，让 gateway 的 /api/frontend_defaults
      # 能正确报告当前后端模型（config.py 里优先读 ACTIVE_MODEL 环境变量）。
      ACTIVE_MODEL: "${ACTIVE_MODEL:-minicpm}"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8006"
      - "--https"
      - "--ssl-certfile"
      - "/app/certs/cert.pem"
      - "--ssl-keyfile"
      - "/app/certs/key.pem"
      - "--workers"
      - "cpp-worker-backend:22400"
    ports:
      - "${GATEWAY_HOST_PORT:-8006}:8006"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${CERTS_HOST_PATH:-./certs}:/app/certs:ro
      # 开发期挂载 config.py + 改动的静态前端文件，宿主机改动即时生效，
      # 无需重建镜像。不整体挂载 static/（会盖掉镜像内 bun 构建的 mobile/docs）。
      - ./config.py:/app/config.py:ro
      - ./static/omni/omni.html:/app/static/omni/omni.html:ro
      - ./static/omni/omni-app.js:/app/static/omni/omni-app.js:ro
      - ./static/audio-duplex/audio_duplex.html:/app/static/audio-duplex/audio_duplex.html:ro
      - ./static/audio-duplex/audio-duplex-app.js:/app/static/audio-duplex/audio-duplex-app.js:ro
      - ./static/realtime/realtime-app.js:/app/static/realtime/realtime-app.js:ro
      - ./static/half-duplex/half_duplex.html:/app/static/half-duplex/half_duplex.html:ro
      - ./static/half-duplex/half-duplex-app.js:/app/static/half-duplex/half-duplex-app.js:ro
      - ./static/mobile-omni/index.html:/app/static/mobile-omni/index.html:ro
      - ./static/duplex/ui/duplex-ui.js:/app/static/duplex/ui/duplex-ui.js:ro
    depends_on:
      cpp-worker-backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
