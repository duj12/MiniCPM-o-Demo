# MiniCPM-o C++ backend deployment (docker compose)
#
# Topology:
#   gateway            x1   host :${GATEWAY_HOST_PORT:-8006} -> container :8006
#   cpp-worker-backend x1   one container with:
#       - llama-omni-server (MiniCPM-o) or llama-qwen3omni-server (Qwen3-Omni)
#         backend on 127.0.0.1:22500
#       - Python worker on 0.0.0.0:22400, forwarding to the local backend
#
# Model directory layout:
#   GGUF_MODEL_HOST_PATH/
#     MiniCPM-o-4_5-gguf/           # MiniCPM-o-4.5 (default)
#       MiniCPM-o-4_5-Q4_K_M.gguf
#       vision/
#       audio/
#       tts/
#       token2wav-gguf/
#     qwen3omni-gguf/                # Qwen3-Omni (ACTIVE_MODEL=qwen3omni)
#       Qwen3-Omni-30B-A3B-Instruct-Q4_K_S.gguf
#       mmproj-Qwen3-Omni-30B-A3B-Instruct-Q8_0.gguf
#
# Usage:
#   mkdir -p certs data
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/key.pem -out certs/cert.pem -subj "/CN=minicpm-o"
#   GGUF_MODEL_HOST_PATH=/path/to/models_dir \
#   GATEWAY_HOST_PORT=8006 \
#   CPP_GPU_ID=0 \
#   docker compose -f docker-compose.cpp.yml up -d --build

services:
  cpp-worker-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpp-worker-backend
      args:
        LLAMA_OMNI_REFSPEC: ${LLAMA_OMNI_REFSPEC:-master}
        LLAMA_OMNI_REF: ${LLAMA_OMNI_REF:-origin/master}
    image: minicpm-cpp-worker-backend:dev
    container_name: minicpm-o-demo-cpp-worker-1
    environment:
      ACTIVE_MODEL: "${ACTIVE_MODEL:-minicpm}"
      GPU_ID: "0"
      BACKEND_PORT: "22500"
      WORKER_PORT: "22400"
      LLAMA_SERVER_EXTRA_ARGS: "${LLAMA_SERVER_EXTRA_ARGS:--c 16384 --parallel 4}"
      GGML_CUDA_DISABLE_GRAPHS: "1"
    volumes:
      # Mount the parent directory containing both MiniCPM and Qwen3-Omni model dirs.
      # Expected layout on host:
      #   <GGUF_MODEL_HOST_PATH>/
      #     MiniCPM-o-4_5-gguf/    (for ACTIVE_MODEL=minicpm)
      #     qwen3omni-gguf/        (for ACTIVE_MODEL=qwen3omni)
      - ${GGUF_MODEL_HOST_PATH:?set GGUF_MODEL_HOST_PATH (parent of MiniCPM-o-4_5-gguf/ and qwen3omni-gguf/)}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "${CPP_GPU_ID:-0}" ]
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1:22400/health" ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: minicpm-gateway:dev
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8006"
      - "--https"
      - "--ssl-certfile"
      - "/app/certs/cert.pem"
      - "--ssl-keyfile"
      - "/app/certs/key.pem"
      - "--workers"
      - "cpp-worker-backend:22400"
    ports:
      - "${GATEWAY_HOST_PORT:-8006}:8006"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${CERTS_HOST_PATH:-./certs}:/app/certs:ro
    depends_on:
      cpp-worker-backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
